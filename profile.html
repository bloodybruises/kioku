<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>kioku 記憶 — profile</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:#efedef;
  color:#222;
  font-family:Arial,sans-serif;
  transition:.2s;
}

.top{
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:20px;
  letter-spacing:1px;
}

.back{
  border:0;
  background:transparent;
  cursor:pointer;
  color:#222;
  font-size:14px;
}

.wrap{
  width:min(850px,94%);
  margin:20px auto 80px;
}

h1{
  font-size:28px;
  font-weight:400;
  margin:20px 0 5px;
}

.sub{
  color:#777;
  font-size:13px;
  margin-bottom:25px;
}

.card{
  background:rgba(255,255,255,.65);
  border:1px solid rgba(0,0,0,.08);
  border-radius:22px;
  padding:22px;
  margin-bottom:18px;
}

label{
  display:block;
  font-size:13px;
  margin-bottom:7px;
  color:#555;
}

input[type="text"],
textarea,
select{
  width:100%;
  border:1px solid #ddd;
  background:#fff;
  border-radius:12px;
  padding:12px;
  font:inherit;
  outline:none;
}

textarea{
  min-height:100px;
  resize:vertical;
}

.field{
  margin-bottom:18px;
}

.colors{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.colorbox{
  display:flex;
  align-items:center;
  gap:10px;
}

input[type="color"]{
  width:45px;
  height:38px;
  border:0;
  padding:0;
  background:transparent;
}

.upload-section{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.upload-box{
  text-align:center;
}

.image-preview{
  width:130px;
  height:130px;
  border-radius:50%;
  object-fit:cover;
  display:block;
  margin:0 auto 14px;
  background:#ddd;
  border:3px solid white;
  box-shadow:0 4px 18px rgba(0,0,0,.1);
}

.banner-preview{
  width:100%;
  height:150px;
  border-radius:15px;
  object-fit:cover;
  display:block;
  margin-bottom:14px;
  background:#ddd;
}

.upload-button{
  display:inline-block;
  border:1px solid #222 !important;
  background:#fff !important;
  color:#222 !important;
  padding:10px 16px;
  border-radius:999px;
  cursor:pointer;
  font:inherit;
  font-size:13px;
  appearance:none;
  -webkit-appearance:none;
}

.upload-button:hover{
  background:#f2f2f2 !important;
}

.upload-button:active{
  background:#eee !important;
  color:#222 !important;
}

input[type="file"]{
  display:none;
}

.save{
  width:100%;
  border:0;
  border-radius:999px;
  padding:14px;
  background:#222;
  color:white;
  cursor:pointer;
  font:inherit;
}

.save:disabled{
  opacity:.6;
  cursor:default;
}

.logout{
  width:100%;
  border:1px solid #bbb;
  border-radius:999px;
  padding:12px;
  background:white;
  color:#222;
  cursor:pointer;
  margin-top:10px;
  font:inherit;
}

.status{
  text-align:center;
  font-size:13px;
  margin-top:12px;
  min-height:18px;
}

.preview-title{
  font-size:13px;
  color:#777;
  margin-bottom:10px;
}

.profile-preview{
  border-radius:22px;
  overflow:hidden;
  background:#efedef;
  transition:.2s;
}

.preview-banner{
  height:150px;
  background:#ddd center/cover no-repeat;
}

.preview-content{
  padding:0 22px 25px;
  position:relative;
}

.preview-avatar{
  width:90px;
  height:90px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #efedef;
  margin-top:-45px;
  background:#ddd;
  display:block;
}

.preview-name{
  font-size:24px;
  margin-top:12px;
}

.preview-username{
  font-size:13px;
  opacity:.55;
  margin-top:3px;
}

.preview-bio{
  margin-top:14px;
  font-size:14px;
  line-height:1.5;
}

.preview-layout-box{
  margin-top:20px;
  padding:15px;
  border:1px solid rgba(0,0,0,.1);
  border-radius:15px;
}

/* cropper */

.crop-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.78);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:1000;
  padding:15px;
}

.crop-overlay.active{
  display:flex;
}

.crop-modal{
  width:min(700px,100%);
  background:#fff;
  border-radius:22px;
  padding:18px;
  max-height:95vh;
  overflow:auto;
}

.crop-title{
  font-size:18px;
  margin-bottom:12px;
}

.crop-area{
  width:100%;
  height:420px;
  overflow:hidden;
  background:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:14px;
  position:relative;
  touch-action:none;
}

.crop-area.banner-mode{
  height:300px;
}

.crop-image-wrap{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

#cropImage{
  position:absolute;
  max-width:none;
  max-height:none;
  user-select:none;
  -webkit-user-drag:none;
  touch-action:none;
  transform-origin:center center;
}

.crop-mask{
  position:absolute;
  pointer-events:none;
  border:2px solid rgba(255,255,255,.9);
  box-shadow:0 0 0 9999px rgba(0,0,0,.35);
}

.crop-mask.avatar-mask{
  width:min(82vw,360px);
  height:min(82vw,360px);
  max-width:82%;
  max-height:82%;
  border-radius:50%;
}

.crop-mask.banner-mask{
  width:88%;
  height:58%;
  border-radius:8px;
}

.crop-controls{
  display:flex;
  gap:10px;
  align-items:center;
  margin-top:15px;
}

.crop-controls span{
  font-size:13px;
}

.crop-controls input{
  flex:1;
}

.crop-buttons{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.crop-buttons button{
  flex:1;
  border-radius:999px;
  padding:12px;
  border:1px solid #ccc;
  background:#fff;
  color:#222;
  cursor:pointer;
  font:inherit;
}

.crop-buttons .apply{
  background:#222;
  color:#fff;
  border-color:#222;
}

@media(max-width:600px){

  .upload-section{
    grid-template-columns:1fr;
  }

  .colors{
    grid-template-columns:1fr;
  }

  .crop-modal{
    border-radius:18px;
  }

  .crop-area{
    height:330px;
  }

  .crop-area.banner-mode{
    height:240px;
  }
}
</style>
</head>

<body>

<div class="top">
  <div class="logo">kioku 記憶</div>

  <button
    class="back"
    id="backBtn"
    type="button">
    ← back
  </button>
</div>


<div class="wrap">

<h1>your profile</h1>

<div class="sub">
  shape the little corner of kioku that belongs to you.
</div>


<div class="card">

  <div class="upload-section">

    <!-- PROFILE PICTURE -->

    <div class="upload-box">

      <img
        id="avatarPreview"
        class="image-preview"
        alt="profile picture">

      <button
        type="button"
        class="upload-button"
        id="avatarButton">
        change profile picture
      </button>

      <input
        type="file"
        id="avatarInput"
        accept="image/*">

    </div>


    <!-- BANNER -->

    <div class="upload-box">

      <img
        id="bannerPreview"
        class="banner-preview"
        alt="profile banner">

      <button
        type="button"
        class="upload-button"
        id="bannerButton">
        change banner
      </button>

      <input
        type="file"
        id="bannerInput"
        accept="image/*">

    </div>

  </div>

</div>


<div class="card">

  <div class="field">

    <label>display name</label>

    <input
      id="displayName"
      type="text"
      maxlength="50">

  </div>


  <div class="field">

    <label>username</label>

    <input
      id="username"
      type="text"
      maxlength="30"
      placeholder="yourname">

  </div>


  <div class="field">

    <label>bio</label>

    <textarea
      id="bio"
      maxlength="300"></textarea>

  </div>


  <div class="colors">

    <div class="field">

      <label>page color</label>

      <div class="colorbox">

        <input
          id="pageColor"
          type="color"
          value="#efedef">

        <span id="pageColorText">
          #efedef
        </span>

      </div>

    </div>


    <div class="field">

      <label>accent color</label>

      <div class="colorbox">

        <input
          id="accentColor"
          type="color"
          value="#e8b8cb">

        <span id="accentColorText">
          #e8b8cb
        </span>

      </div>

    </div>

  </div>


  <div class="field">

    <label>font</label>

    <select id="font">

      <option value="sans">sans</option>
      <option value="serif">serif</option>
      <option value="mono">mono</option>

    </select>

  </div>


  <div class="field">

    <label>profile layout</label>

    <select id="layout">

      <option value="soft">soft</option>
      <option value="minimal">minimal</option>
      <option value="boxed">boxed</option>

    </select>

  </div>

</div>


<!-- LIVE PREVIEW -->

<div class="card">

  <div class="preview-title">
    live preview
  </div>


  <div
    class="profile-preview"
    id="profilePreview">

    <div
      class="preview-banner"
      id="previewBanner">
    </div>


    <div class="preview-content">

      <img
        id="previewAvatar"
        class="preview-avatar"
        alt="">


      <div
        class="preview-name"
        id="previewName">
        your name
      </div>


      <div
        class="preview-username"
        id="previewUsername">
        @username
      </div>


      <div
        class="preview-bio"
        id="previewBio">
        your bio will appear here.
      </div>


      <div
        class="preview-layout-box"
        id="previewLayoutBox">
        posts will appear here
      </div>

    </div>

  </div>

</div>


<div class="card">

  <button
    class="save"
    id="saveBtn"
    type="button">
    save profile
  </button>


  <div
    class="status"
    id="status">
  </div>


  <button
    class="logout"
    id="logoutBtn"
    type="button">
    log out
  </button>

</div>

</div>


<!-- CROP MODAL -->

<div
  class="crop-overlay"
  id="cropOverlay">

  <div class="crop-modal">

    <div
      class="crop-title"
      id="cropTitle">
      crop image
    </div>


    <div
      class="crop-area"
      id="cropArea">

      <div class="crop-image-wrap">

        <img
          id="cropImage"
          alt="crop">

        <div
          class="crop-mask"
          id="cropMask">
        </div>

      </div>

    </div>


    <div class="crop-controls">

      <span>zoom</span>

      <input
        id="zoomSlider"
        type="range"
        min="1"
        max="4"
        step="0.01"
        value="1">

    </div>


    <div class="crop-buttons">

      <button
        type="button"
        id="cancelCrop">
        cancel
      </button>


      <button
        type="button"
        class="apply"
        id="applyCrop">
        crop & use
      </button>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://qadbabbfhrqcbmjrkuvw.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_enmLwzFK9xOIZGLVe-3BdA_P6F7kmNn";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


const $ = id =>
  document.getElementById(id);


let user = null;

let avatarUrl = null;

let bannerUrl = null;

let cropType = null;

let cropFile = null;

let cropObjectUrl = null;

let zoom = 1;

let dragX = 0;

let dragY = 0;

let dragging = false;

let startX = 0;

let startY = 0;

let startDragX = 0;

let startDragY = 0;


/* --------------------------------------------------
   DEFAULT PLACEHOLDERS
-------------------------------------------------- */

const DEFAULT_AVATAR =
  "data:image/svg+xml;charset=UTF-8," +
  encodeURIComponent(`
    <svg xmlns="http://www.w3.org/2000/svg"
         width="300"
         height="300">
      <rect width="100%" height="100%" fill="#ddd"/>
      <text x="50%"
            y="50%"
            dominant-baseline="middle"
            text-anchor="middle"
            fill="#888"
            font-size="90">?</text>
    </svg>
  `);


const DEFAULT_BANNER =
  "data:image/svg+xml;charset=UTF-8," +
  encodeURIComponent(`
    <svg xmlns="http://www.w3.org/2000/svg"
         width="1200"
         height="400">
      <rect width="100%"
            height="100%"
            fill="#ddd"/>
    </svg>
  `);


/* --------------------------------------------------
   STATUS
-------------------------------------------------- */

function setStatus(message){

  $("status").textContent = message;

}


/* --------------------------------------------------
   LOAD PROFILE
-------------------------------------------------- */

async function loadProfile(){

  const {
    data: { session },
    error: sessionError
  } =
    await supabaseClient.auth.getSession();


  if(sessionError){

    console.error(sessionError);

    setStatus(
      "couldn't check login: " +
      sessionError.message
    );

    return;
  }


  if(!session){

    window.location.href =
      "auth.html";

    return;
  }


  user = session.user;


  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id", user.id)
      .maybeSingle();


  if(error){

    console.error(error);

    setStatus(
      "couldn't load profile: " +
      error.message
    );

    return;
  }


  if(data){

    $("displayName").value =
      data.display_name || "";


    $("username").value =
      data.username || "";


    $("bio").value =
      data.bio || "";


    $("pageColor").value =
      data.page_color ||
      "#efedef";


    $("accentColor").value =
      data.accent_color ||
      "#e8b8cb";


    $("font").value =
      data.font ||
      "sans";


    $("layout").value =
      data.layout ||
      "soft";


    avatarUrl =
      data.avatar_url ||
      null;


    bannerUrl =
      data.background_url ||
      null;

  }else{

    $("username").value =
      user.user_metadata?.username ||
      "";


    $("displayName").value =
      user.user_metadata?.display_name ||
      "";

  }


  updateImages();

  updatePreview();

}


/* --------------------------------------------------
   UPDATE IMAGES
-------------------------------------------------- */

function updateImages(){

  $("avatarPreview").src =
    avatarUrl ||
    DEFAULT_AVATAR;


  $("previewAvatar").src =
    avatarUrl ||
    DEFAULT_AVATAR;


  $("bannerPreview").src =
    bannerUrl ||
    DEFAULT_BANNER;


  if(bannerUrl){

    $("previewBanner").style.backgroundImage =
      `url("${bannerUrl}")`;

  }else{

    $("previewBanner").style.backgroundImage =
      `url("${DEFAULT_BANNER}")`;

  }

}


/* --------------------------------------------------
   LIVE PREVIEW
-------------------------------------------------- */

function updatePreview(){

  const name =
    $("displayName").value.trim();


  const username =
    $("username")
      .value
      .trim()
      .replace(/^@/, "");


  const bio =
    $("bio").value.trim();


  const pageColor =
    $("pageColor").value;


  const accentColor =
    $("accentColor").value;


  const font =
    $("font").value;


  const layout =
    $("layout").value;


  $("previewName").textContent =
    name || "your name";


  $("previewUsername").textContent =
    username
      ? "@" + username
      : "@username";


  $("previewBio").textContent =
    bio ||
    "your bio will appear here.";


  $("profilePreview").style.background =
    pageColor;


  $("previewAvatar").style.borderColor =
    pageColor;


  $("previewBanner").style.backgroundColor =
    accentColor;


  $("pageColorText").textContent =
    pageColor;


  $("accentColorText").textContent =
    accentColor;


  if(font === "serif"){

    $("profilePreview").style.fontFamily =
      "Georgia, serif";

  }else if(font === "mono"){

    $("profilePreview").style.fontFamily =
      "monospace";

  }else{

    $("profilePreview").style.fontFamily =
      "Arial, sans-serif";

  }


  if(layout === "minimal"){

    $("profilePreview").style.borderRadius =
      "5px";

    $("previewLayoutBox").style.borderRadius =
      "3px";

    $("previewLayoutBox").style.borderWidth =
      "1px";

  }else if(layout === "boxed"){

    $("profilePreview").style.borderRadius =
      "8px";

    $("previewLayoutBox").style.borderRadius =
      "5px";

    $("previewLayoutBox").style.borderWidth =
      "2px";

  }else{

    $("profilePreview").style.borderRadius =
      "22px";

    $("previewLayoutBox").style.borderRadius =
      "15px";

    $("previewLayoutBox").style.borderWidth =
      "1px";

  }

}


/* --------------------------------------------------
   FILE PICKERS
-------------------------------------------------- */

$("avatarButton").addEventListener(
  "click",
  function(){

    $("avatarInput").click();

  }
);


$("bannerButton").addEventListener(
  "click",
  function(){

    $("bannerInput").click();

  }
);


$("avatarInput").addEventListener(
  "change",
  function(event){

    const file =
      event.target.files &&
      event.target.files[0];


    if(!file){

      return;
    }


    openCropper(
      file,
      "avatar"
    );

  }
);


$("bannerInput").addEventListener(
  "change",
  function(event){

    const file =
      event.target.files &&
      event.target.files[0];


    if(!file){

      return;
    }


    openCropper(
      file,
      "banner"
    );

  }
);


/* --------------------------------------------------
   OPEN CROPPER
-------------------------------------------------- */

function openCropper(
  file,
  type
){

  if(!file.type.startsWith("image/")){

    setStatus(
      "please choose an image."
    );

    return;
  }


  if(file.size > 10 * 1024 * 1024){

    setStatus(
      "image must be smaller than 10 MB."
    );

    return;
  }


  cropType = type;

  cropFile = file;

  zoom = 1;

  dragX = 0;

  dragY = 0;


  $("zoomSlider").value =
    "1";


  if(type === "avatar"){

    $("cropTitle").textContent =
      "crop profile picture";


    $("cropArea")
      .classList
      .remove("banner-mode");


    $("cropMask")
      .className =
      "crop-mask avatar-mask";

  }else{

    $("cropTitle").textContent =
      "crop banner";


    $("cropArea")
      .classList
      .add("banner-mode");


    $("cropMask")
      .className =
      "crop-mask banner-mask";

  }


  if(cropObjectUrl){

    URL.revokeObjectURL(
      cropObjectUrl
    );

  }


  cropObjectUrl =
    URL.createObjectURL(file);


  $("cropImage").src =
    cropObjectUrl;


  $("cropOverlay")
    .classList
    .add("active");


  $("cropImage").onload =
    function(){

      setupCropImage();

    };

}


/* --------------------------------------------------
   CROP IMAGE SETUP
-------------------------------------------------- */

function setupCropImage(){

  const image =
    $("cropImage");


  const area =
    $("cropArea");


  const mask =
    $("cropMask");


  const maskWidth =
    mask.getBoundingClientRect().width;


  const maskHeight =
    mask.getBoundingClientRect().height;


  const imageWidth =
    image.naturalWidth;


  const imageHeight =
    image.naturalHeight;


  const imageRatio =
    imageWidth /
    imageHeight;


  const cropRatio =
    maskWidth /
    maskHeight;


  let displayWidth;

  let displayHeight;


  /*
    Make the image cover the crop frame.
  */

  if(imageRatio > cropRatio){

    displayHeight =
      maskHeight;

    displayWidth =
      displayHeight *
      imageRatio;

  }else{

    displayWidth =
      maskWidth;

    displayHeight =
      displayWidth /
      imageRatio;

  }


  image.style.width =
    displayWidth + "px";


  image.style.height =
    displayHeight + "px";


  image.style.left =
    "50%";


  image.style.top =
    "50%";


  image.style.transform =
    "translate(-50%, -50%)";


  image.dataset.baseWidth =
    displayWidth;


  image.dataset.baseHeight =
    displayHeight;


  updateCropTransform();

}


/* --------------------------------------------------
   CROP TRANSFORM
-------------------------------------------------- */

function updateCropTransform(){

  const image =
    $("cropImage");


  const baseWidth =
    parseFloat(
      image.dataset.baseWidth
    ) || 1;


  const baseHeight =
    parseFloat(
      image.dataset.baseHeight
    ) || 1;


  image.style.width =
    (baseWidth * zoom) +
    "px";


  image.style.height =
    (baseHeight * zoom) +
    "px";


  image.style.left =
    `calc(50% + ${dragX}px)`;


  image.style.top =
    `calc(50% + ${dragY}px)`;


  image.style.transform =
    "translate(-50%, -50%)";

}


/* --------------------------------------------------
   ZOOM
-------------------------------------------------- */

$("zoomSlider").addEventListener(
  "input",
  function(){

    zoom =
      parseFloat(
        this.value
      );


    updateCropTransform();

  }
);


/* --------------------------------------------------
   DRAGGING
-------------------------------------------------- */

$("cropImage").addEventListener(
  "pointerdown",
  function(event){

    event.preventDefault();

    dragging = true;

    startX =
      event.clientX;

    startY =
      event.clientY;

    startDragX =
      dragX;

    startDragY =
      dragY;


    this.setPointerCapture(
      event.pointerId
    );

  }
);


$("cropImage").addEventListener(
  "pointermove",
  function(event){

    if(!dragging){

      return;
    }


    event.preventDefault();


    dragX =
      startDragX +
      (event.clientX - startX);


    dragY =
      startDragY +
      (event.clientY - startY);


    updateCropTransform();

  }
);


$("cropImage").addEventListener(
  "pointerup",
  function(){

    dragging = false;

  }
);


$("cropImage").addEventListener(
  "pointercancel",
  function(){

    dragging = false;

  }
);


/* --------------------------------------------------
   CLOSE CROPPER
-------------------------------------------------- */

$("cancelCrop").addEventListener(
  "click",
  closeCropper
);


function closeCropper(){

  $("cropOverlay")
    .classList
    .remove("active");


  if(cropObjectUrl){

    URL.revokeObjectURL(
      cropObjectUrl
    );

    cropObjectUrl = null;

  }


  $("avatarInput").value = "";

  $("bannerInput").value = "";


  cropFile = null;

  cropType = null;

}


/* --------------------------------------------------
   CREATE ACTUAL CROP
-------------------------------------------------- */

function createCroppedImage(){

  return new Promise(
    function(resolve, reject){

      const image =
        new Image();


      image.onload =
        function(){

          const mask =
            $("cropMask");


          const maskRect =
            mask.getBoundingClientRect();


          const imageElement =
            $("cropImage");


          const imageRect =
            imageElement.getBoundingClientRect();


          const outputWidth =
            cropType === "avatar"
              ? 800
              : 1600;


          const outputHeight =
            cropType === "avatar"
              ? 800
              : 600;


          const canvas =
            document.createElement(
              "canvas"
            );


          canvas.width =
            outputWidth;


          canvas.height =
            outputHeight;


          const ctx =
            canvas.getContext("2d");


          /*
            Determine exactly what part of the
            source image is underneath the crop frame.
          */

          const scaleX =
            image.naturalWidth /
            imageRect.width;


          const scaleY =
            image.naturalHeight /
            imageRect.height;


          const sourceX =
            (
              maskRect.left -
              imageRect.left
            ) * scaleX;


          const sourceY =
            (
              maskRect.top -
              imageRect.top
            ) * scaleY;


          const sourceWidth =
            maskRect.width *
            scaleX;


          const sourceHeight =
            maskRect.height *
            scaleY;


          /*
            Clamp the crop to the actual image.
            This prevents black areas.
          */

          const safeX =
            Math.max(
              0,
              Math.min(
                sourceX,
                image.naturalWidth -
                sourceWidth
              )
            );


          const safeY =
            Math.max(
              0,
              Math.min(
                sourceY,
                image.naturalHeight -
                sourceHeight
              )
            );


          const safeWidth =
            Math.min(
              sourceWidth,
              image.naturalWidth -
              safeX
            );


          const safeHeight =
            Math.min(
              sourceHeight,
              image.naturalHeight -
              safeY
            );


          ctx.drawImage(
            image,
            safeX,
            safeY,
            safeWidth,
            safeHeight,
            0,
            0,
            outputWidth,
            outputHeight
          );


          canvas.toBlob(
            function(blob){

              if(blob){

                resolve(blob);

              }else{

                reject(
                  new Error(
                    "couldn't create cropped image."
                  )
                );

              }

            },
            "image/jpeg",
            0.92
          );

        };


      image.onerror =
        function(){

          reject(
            new Error(
              "couldn't read image."
            )
          );

        };


      image.src =
        cropObjectUrl;

    }
  );

}


/* --------------------------------------------------
   APPLY CROP + UPLOAD
-------------------------------------------------- */

$("applyCrop").addEventListener(
  "click",
  async function(){

    if(!cropFile ||
       !cropType ||
       !user){

      return;
    }


    const uploadedType =
      cropType;


    setStatus(
      "cropping image..."
    );


    $("applyCrop").disabled =
      true;


    try{

      const blob =
        await createCroppedImage();


      setStatus(
        "uploading image..."
      );


      const folder =
        uploadedType === "avatar"
          ? "profile"
          : "banners";


      const path =
        folder +
        "/" +
        user.id +
        "-" +
        Date.now() +
        ".jpg";


      const {
        error: uploadError
      } =
        await supabaseClient
          .storage
          .from("avatars")
          .upload(
            path,
            blob,
            {
              contentType:
                "image/jpeg",
              upsert:
                false
            }
          );


      if(uploadError){

        throw uploadError;

      }


      const {
        data: publicData
      } =
        supabaseClient
          .storage
          .from("avatars")
          .getPublicUrl(
            path
          );


      if(
        !publicData ||
        !publicData.publicUrl
      ){

        throw new Error(
          "Supabase did not return an image URL."
        );

      }


      const finalUrl =
        publicData.publicUrl +
        "?v=" +
        Date.now();


      if(uploadedType === "avatar"){

        avatarUrl =
          finalUrl;

      }else{

        bannerUrl =
          finalUrl;

      }


      updateImages();

      updatePreview();


      closeCropper();


      setStatus(
        uploadedType === "avatar"
          ? "profile picture uploaded. save your profile."
          : "banner uploaded. save your profile."
      );


    }catch(error){

      console.error(
        "IMAGE UPLOAD ERROR:",
        error
      );


      setStatus(
        "Upload error: " +
        (
          error.message ||
          "something went wrong."
        )
      );

    }finally{

      $("applyCrop").disabled =
        false;

    }

  }
);


/* --------------------------------------------------
   SAVE PROFILE
-------------------------------------------------- */

$("saveBtn").addEventListener(
  "click",
  async function(){

    if(!user){

      return;

    }


    const username =
      $("username")
        .value
        .trim()
        .replace(/^@/, "");


    const displayName =
      $("displayName")
        .value
        .trim();


    if(!username){

      setStatus(
        "username is required."
      );

      return;

    }


    $("saveBtn").disabled =
      true;


    setStatus(
      "saving..."
    );


    const profileData = {

      id:
        user.id,

      username:
        username,

      display_name:
        displayName,

      bio:
        $("bio")
          .value
          .trim(),

      avatar_url:
        avatarUrl,

      background_url:
        bannerUrl,

      page_color:
        $("pageColor")
          .value,

      accent_color:
        $("accentColor")
          .value,

      font:
        $("font")
          .value,

      layout:
        $("layout")
          .value,

      updated_at:
        new Date()
          .toISOString()

    };


    const {
      error
    } =
      await supabaseClient
        .from("profiles")
        .upsert(
          profileData,
          {
            onConflict:
              "id"
          }
        );


    $("saveBtn").disabled =
      false;


    if(error){

      console.error(error);

      setStatus(
        "Save error: " +
        error.message
      );

      return;

    }


    setStatus(
      "profile saved ✓"
    );

  }
);
