<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>kioku 記憶 — profile</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #efedef;
      color: #222;
      font-family: Arial, sans-serif;
      transition: background .3s ease;
    }

    .topbar {
      height: 64px;
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,.72);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(0,0,0,.06);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .logo {
      color: #222;
      text-decoration: none;
      font-size: 20px;
      letter-spacing: .04em;
    }

    .topbar button {
      border: 0;
      background: none;
      font-size: 13px;
      cursor: pointer;
    }

    .page {
      width: min(900px, calc(100% - 28px));
      margin: 28px auto 60px;
    }

    .editor {
      background: rgba(255,255,255,.75);
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(0,0,0,.07);
    }

    .previewBanner {
      height: 240px;
      background: #ded9dd;
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .bannerButton {
      position: absolute;
      right: 18px;
      bottom: 18px;
      background: rgba(255,255,255,.88);
      border: 0;
      padding: 10px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 13px;
    }

    .profileSection {
      padding: 0 30px 30px;
      position: relative;
    }

    .avatarWrap {
      position: relative;
      width: 120px;
      height: 120px;
      margin-top: -60px;
      margin-bottom: 18px;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      background: #ddd7db;
      border: 5px solid rgba(255,255,255,.95);
      display: block;
    }

    .avatarButton {
      position: absolute;
      right: -4px;
      bottom: 2px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid white;
      background: #222;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 500;
    }

    .handle {
      color: #888;
      margin-top: 4px;
      font-size: 14px;
    }

    .form {
      padding: 30px;
      border-top: 1px solid rgba(0,0,0,.07);
    }

    label {
      display: block;
      margin: 18px 0 7px;
      font-size: 13px;
      color: #555;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #d8d3d7;
      border-radius: 12px;
      padding: 12px 13px;
      background: white;
      font-size: 14px;
      outline: none;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #d49ab3;
    }

    .colors {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    input[type="color"] {
      height: 48px;
      padding: 4px;
    }

    .save {
      margin-top: 28px;
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #e8b8cb;
      cursor: pointer;
      font-size: 15px;
    }

    .save:disabled {
      opacity: .6;
    }

    #message {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      background: #f4e1e8;
      font-size: 13px;
      line-height: 1.5;
      display: none;
    }

    .sectionTitle {
      margin-top: 28px;
      font-size: 15px;
      font-weight: 500;
    }

    @media (max-width: 600px) {
      .previewBanner {
        height: 180px;
      }

      .profileSection,
      .form {
        padding-left: 20px;
        padding-right: 20px;
      }

      .colors {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <a class="logo" href="index.html">kioku 記憶</a>
    <button id="logout">log out</button>
  </header>

  <main class="page">

    <div class="editor">

      <div id="previewBanner" class="previewBanner">

        <button
          class="bannerButton"
          type="button"
          id="bannerUploadButton"
        >
          change banner
        </button>

      </div>

      <div class="profileSection">

        <div class="avatarWrap">

          <img
            id="avatar"
            class="avatar"
            src=""
            alt="profile picture"
          >

          <button
            class="avatarButton"
            type="button"
            id="avatarUploadButton"
          >
            +
          </button>

        </div>

        <h1 id="previewName">your name</h1>
        <div class="handle" id="previewUsername">@username</div>

      </div>

      <div class="form">

        <div class="sectionTitle">
          profile
        </div>

        <label for="displayName">
          display name
        </label>

        <input
          id="displayName"
          type="text"
          placeholder="your name"
        >

        <label for="username">
          username
        </label>

        <input
          id="username"
          type="text"
          placeholder="username"
        >

        <label for="bio">
          bio
        </label>

        <textarea
          id="bio"
          placeholder="tell people a little about yourself..."
        ></textarea>


        <div class="sectionTitle">
          appearance
        </div>

        <label>
          colors
        </label>

        <div class="colors">

          <div>
            <small>page color</small>
            <input id="pageColor" type="color" value="#efedef">
          </div>

          <div>
            <small>accent color</small>
            <input id="accentColor" type="color" value="#e8b8cb">
          </div>

        </div>


        <label for="font">
          font
        </label>

        <select id="font">
          <option value="sans">sans</option>
          <option value="serif">serif</option>
          <option value="mono">mono</option>
        </select>


        <label for="layout">
          profile layout
        </label>

        <select id="layout">
          <option value="soft">soft</option>
          <option value="minimal">minimal</option>
          <option value="boxed">boxed</option>
        </select>


        <button class="save" id="save">
          save profile
        </button>

        <div id="message"></div>

      </div>

    </div>

  </main>


  <input
    id="avatarFile"
    type="file"
    accept="image/*"
    hidden
  >

  <input
    id="bannerFile"
    type="file"
    accept="image/*"
    hidden
  >


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://qadbabbfhrqcbmjrkuvw.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_enmLwzFK9xOIZGLVe-3BdA_P6F7kmNn";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    const $ = id =>
      document.getElementById(id);


    let user = null;
    let avatarUrl = null;
    let bannerUrl = null;


    function showMessage(text) {
      $("message").textContent = text;
      $("message").style.display = "block";
    }


    function hideMessage() {
      $("message").style.display = "none";
    }


    function updatePreview() {

      $("previewName").textContent =
        $("displayName").value.trim() || "your name";

      $("previewUsername").textContent =
        "@" + (
          $("username").value
            .trim()
            .replace(/^@/, "") ||
          "username"
        );

      document.body.style.background =
        $("pageColor").value;

      $("previewBanner").style.backgroundColor =
        $("accentColor").value;

      const font = $("font").value;

      if (font === "serif") {
        document.body.style.fontFamily =
          "Georgia, serif";
      }

      else if (font === "mono") {
        document.body.style.fontFamily =
          "monospace";
      }

      else {
        document.body.style.fontFamily =
          "Arial, sans-serif";
      }
    }


    async function loadProfile() {

      const {
        data: { session }
      } = await supabaseClient.auth.getSession();

      if (!session) {
        window.location.href = "auth.html";
        return;
      }

      user = session.user;

      const { data, error } =
        await supabaseClient
          .from("profiles")
          .select("*")
          .eq("id", user.id)
          .maybeSingle();

      if (error) {
        showMessage(
          "Couldn't load profile: " +
          error.message
        );
        return;
      }


      if (data) {

        $("displayName").value =
          data.display_name || "";

        $("username").value =
          data.username || "";

        $("bio").value =
          data.bio || "";

        $("pageColor").value =
          data.page_color || "#efedef";

        $("accentColor").value =
          data.accent_color || "#e8b8cb";

        $("font").value =
          data.font || "sans";

        $("layout").value =
          data.layout || "soft";

        avatarUrl =
          data.avatar_url || null;

        bannerUrl =
          data.background_url || null;

        if (avatarUrl) {
          $("avatar").src = avatarUrl;
        }

        if (bannerUrl) {
          $("previewBanner").style.backgroundImage =
            `url("${bannerUrl}")`;
        }

      } else {

        const metadata =
          user.user_metadata || {};

        $("username").value =
          metadata.username || "";

        $("displayName").value =
          metadata.display_name || "";

      }

      updatePreview();
    }


    async function uploadImage(file, folder) {

      if (!file) return null;

      if (!file.type.startsWith("image/")) {
        throw new Error(
          "Please choose an image file."
        );
      }

      if (file.size > 10 * 1024 * 1024) {
        throw new Error(
          "That image is too large. Please use an image under 10 MB."
        );
      }

      const extension =
        file.name.split(".").pop().toLowerCase();

      const path =
        `${folder}/${user.id}-${Date.now()}.${extension}`;

      const { error } =
        await supabaseClient.storage
          .from("avatars")
          .upload(path, file, {
            upsert: true
          });

      if (error) {
        throw error;
      }

      const { data } =
        supabaseClient.storage
          .from("avatars")
          .getPublicUrl(path);

      return data.publicUrl;
    }


    $("avatarUploadButton").addEventListener(
      "click",
      () => $("avatarFile").click()
    );


    $("bannerUploadButton").addEventListener(
      "click",
      () => $("bannerFile").click()
    );


    $("avatarFile").addEventListener(
      "change",
      async event => {

        const file =
          event.target.files[0];

        if (!file) return;

        try {

          showMessage("uploading profile picture...");

          const url =
            await uploadImage(
              file,
              "profile"
            );

          avatarUrl = url;

          $("avatar").src = url;

          showMessage(
            "profile picture uploaded. save your profile to keep it."
          );

        } catch (error) {

          showMessage(
            "Upload error: " +
            error.message
          );
        }
      }
    );


    $("bannerFile").addEventListener(
      "change",
      async event => {

        const file =
          event.target.files[0];

        if (!file) return;

        try {

          showMessage("uploading banner...");

          const url =
            await uploadImage(
              file,
              "banners"
            );

          bannerUrl = url;

          $("previewBanner").style.backgroundImage =
            `url("${url}")`;

          showMessage(
            "banner uploaded. save your profile to keep it."
          );

        } catch (error) {

          showMessage(
            "Upload error: " +
            error.message
          );
        }
      }
    );


    [
      "displayName",
      "username",
      "bio",
      "pageColor",
      "accentColor",
      "font",
      "layout"
    ].forEach(id => {

      $(id).addEventListener(
        "input",
        updatePreview
      );

      $(id).addEventListener(
        "change",
        updatePreview
      );

    });


    $("save").addEventListener(
      "click",
      async () => {

        hideMessage();

        const username =
          $("username").value
            .trim()
            .replace(/^@/, "");

        const displayName =
          $("displayName").value.trim();

        if (!username) {
          showMessage(
            "Please choose a username."
          );
          return;
        }

        if (!displayName) {
          showMessage(
            "Please enter a display name."
          );
          return;
        }

        $("save").disabled = true;
        $("save").textContent =
          "saving...";

        try {

          const profileData = {

            id: user.id,

            username,

            display_name:
              displayName,

            bio:
              $("bio").value.trim(),

            avatar_url:
              avatarUrl,

            background_url:
              bannerUrl,

            page_color:
              $("pageColor").value,

            accent_color:
              $("accentColor").value,

            font:
              $("font").value,

            layout:
              $("layout").value

          };


          const { error } =
            await supabaseClient
              .from("profiles")
              .upsert(
                profileData,
                { onConflict: "id" }
              );


          if (error) {
            throw error;
          }


          showMessage(
            "profile saved."
          );

        } catch (error) {

          showMessage(
            "Save error: " +
            error.message
          );

        } finally {

          $("save").disabled = false;
          $("save").textContent =
            "save profile";

        }

      }
    );


    $("logout").addEventListener(
      "click",
      async () => {

        await supabaseClient.auth.signOut();

        window.location.href =
          "auth.html";
      }
    );


    loadProfile();

  </script>

</body>
</html>
