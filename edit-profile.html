<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>kioku 記憶 · edit profile</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#101012;
  --panel:#17171a;
  --text:#f4f1f3;
  --muted:#aaa3aa;
  --line:#ffffff1c;
  --soft:#ffffff0a;
  --accent:#f2a9c8;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font:300 13px Manrope,sans-serif;
}

button,
input,
textarea,
select{
  font:inherit;
  color:inherit;
}

button{
  cursor:pointer;
}

.topbar{
  height:76px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  padding:0 4vw;
  gap:12px;
  position:sticky;
  top:0;
  z-index:20;
  background:#101012e8;
  backdrop-filter:blur(18px);
}

.logo{
  color:var(--text);
  text-decoration:none;
  font:18px 'DM Mono',monospace;
}

.logo small{
  color:var(--accent);
  font-size:10px;
  margin-left:5px;
}

.back{
  margin-left:auto;
  border:1px solid var(--line);
  background:var(--soft);
  border-radius:999px;
  padding:9px 14px;
  font-size:11px;
}

.back:hover{
  color:var(--accent);
  border-color:#f2a9c84d;
}

.page{
  width:min(1050px,92vw);
  margin:auto;
  padding:65px 0 90px;
}

.heading{
  margin-bottom:35px;
}

.heading p{
  color:var(--muted);
  font:10px 'DM Mono',monospace;
  text-transform:uppercase;
  letter-spacing:.12em;
  margin:0 0 12px;
}

.heading h1{
  font-size:42px;
  font-weight:300;
  letter-spacing:-.05em;
  margin:0;
}

.layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 360px;
  gap:30px;
  align-items:start;
}

.panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:28px;
}

.section{
  border-bottom:1px solid var(--line);
  padding-bottom:28px;
  margin-bottom:28px;
}

.section:last-child{
  border-bottom:0;
  padding-bottom:0;
  margin-bottom:0;
}

.section-title{
  color:var(--muted);
  font:10px 'DM Mono',monospace;
  text-transform:uppercase;
  letter-spacing:.1em;
  margin-bottom:20px;
}

.field{
  margin-bottom:20px;
}

.field:last-child{
  margin-bottom:0;
}

.field label{
  display:block;
  color:var(--muted);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.08em;
  margin-bottom:8px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  background:#111113;
  border:1px solid var(--line);
  border-radius:9px;
  padding:12px;
  outline:none;
}

.field textarea{
  min-height:90px;
  resize:vertical;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:#f2a9c84d;
}

.media-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.media-box{
  border:1px dashed #5a545b;
  border-radius:12px;
  min-height:150px;
  overflow:hidden;
  position:relative;
  background:#111113;
}

.media-preview{
  width:100%;
  height:150px;
  background-size:cover;
  background-position:center;
  display:grid;
  place-items:center;
  color:var(--muted);
  font:10px 'DM Mono',monospace;
  text-transform:uppercase;
}

.media-button{
  display:block;
  width:100%;
  margin-top:9px;
  border:1px solid var(--line);
  background:var(--soft);
  border-radius:999px;
  padding:9px;
  font-size:10px;
  text-align:center;
}

.media-button:hover{
  color:var(--accent);
  border-color:#f2a9c84d;
}

.media-input{
  display:none;
}

.color-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.color-control{
  border:1px solid var(--line);
  background:#111113;
  border-radius:10px;
  padding:10px;
}

.color-control label{
  display:block;
  color:var(--muted);
  font:9px 'DM Mono',monospace;
  text-transform:uppercase;
  margin-bottom:8px;
}

.color-control input{
  width:100%;
  height:42px;
  border:0;
  padding:0;
  background:none;
}

.layout-options{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.layout-option{
  border:1px solid var(--line);
  background:var(--soft);
  border-radius:10px;
  padding:14px 8px;
  text-align:center;
  font:10px 'DM Mono',monospace;
  text-transform:uppercase;
}

.layout-option.active{
  border-color:var(--accent);
  color:var(--accent);
  background:#f2a9c81c;
}

.save{
  width:100%;
  border:0;
  border-radius:999px;
  padding:14px;
  background:var(--accent);
  color:#171217;
  font-weight:500;
}

.save:disabled{
  opacity:.5;
  cursor:default;
}

.status{
  min-height:18px;
  margin-top:12px;
  text-align:center;
  color:var(--muted);
  font:10px 'DM Mono',monospace;
}

.preview-wrap{
  position:sticky;
  top:105px;
}

.preview-label{
  color:var(--muted);
  font:10px 'DM Mono',monospace;
  text-transform:uppercase;
  letter-spacing:.1em;
  margin:0 0 12px;
}

.preview{
  min-height:520px;
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  background:#101012;
}

.preview-banner{
  height:145px;
  background:
    radial-gradient(circle at 30% 30%,#f2a9c82b,transparent 35%),
    linear-gradient(135deg,#1d1b20,#111114);
  background-size:cover;
  background-position:center;
}

.preview-body{
  padding:0 20px 25px;
  margin-top:-30px;
}

.preview-avatar{
  width:64px;
  height:64px;
  border-radius:50%;
  border:4px solid #101012;
  background:#252328;
  background-size:cover;
  background-position:center;
  display:grid;
  place-items:center;
  color:var(--accent);
  font:14px 'DM Mono',monospace;
}

.preview-name{
  margin-top:12px;
  font-size:21px;
  font-weight:300;
}

.preview-username{
  color:var(--accent);
  font:9px 'DM Mono',monospace;
  margin-top:4px;
}

.preview-bio{
  color:var(--muted);
  font-size:10px;
  line-height:1.6;
  margin-top:10px;
  white-space:pre-wrap;
}

.preview-grid{
  columns:2;
  column-gap:7px;
  margin-top:18px;
}

.preview-card{
  break-inside:avoid;
  height:100px;
  margin-bottom:7px;
  border-radius:5px;
  background:linear-gradient(135deg,#252329,#17171a);
}

.preview-card:nth-child(2){
  height:140px;
}

.preview-card:nth-child(3){
  height:85px;
}

.preview-card:nth-child(4){
  height:125px;
}

.crop-overlay{
  position:fixed;
  inset:0;
  z-index:100;
  background:#08080bf5;
  backdrop-filter:blur(20px);
  display:none;
  place-items:center;
  padding:20px;
}

.crop-overlay.open{
  display:grid;
}

.crop-box{
  width:min(600px,94vw);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:20px;
}

.crop-title{
  font:11px 'DM Mono',monospace;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:15px;
}

.crop-area{
  position:relative;
  height:min(55vh,420px);
  background:#08080a;
  border-radius:10px;
  overflow:hidden;
  display:grid;
  place-items:center;
}

.crop-area img{
  max-width:none;
  position:absolute;
  user-select:none;
  touch-action:none;
}

.crop-actions{
  display:flex;
  gap:8px;
  margin-top:15px;
}

.crop-actions button{
  flex:1;
  border:1px solid var(--line);
  background:var(--soft);
  border-radius:999px;
  padding:11px;
}

.crop-actions .use{
  background:var(--accent);
  color:#171217;
  border-color:var(--accent);
}

.zoom{
  width:100%;
  margin-top:15px;
  accent-color:var(--accent);
}

@media(max-width:800px){
  .layout{
    grid-template-columns:1fr;
  }

  .preview-wrap{
    position:static;
  }

  .preview{
    min-height:450px;
  }
}

@media(max-width:600px){
  .page{
    padding-top:45px;
  }

  .heading h1{
    font-size:34px;
  }

  .panel{
    padding:20px;
  }

  .media-row,
  .color-row{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header class="topbar">
  <a class="logo" href="index.html">
    kioku <small>記憶</small>
  </a>

  <button class="back" id="backBtn">profile</button>
</header>

<main class="page">

  <div class="heading">
    <p>personal archive</p>
    <h1>edit profile</h1>
  </div>

  <div class="layout">

    <section class="panel">

      <div class="section">

        <div class="section-title">appearance</div>

        <div class="media-row">

          <div>
            <div class="media-box">
              <div id="avatarPreview" class="media-preview">
                profile image
              </div>
            </div>

            <label class="media-button">
              change profile image
              <input
                id="avatarInput"
                class="media-input"
                type="file"
                accept="image/*"
              >
            </label>
          </div>

          <div>
            <div class="media-box">
              <div id="bannerPreview" class="media-preview">
                background image
              </div>
            </div>

            <label class="media-button">
              change background
              <input
                id="bannerInput"
                class="media-input"
                type="file"
                accept="image/*"
              >
            </label>
          </div>

        </div>

      </div>

      <div class="section">

        <div class="section-title">information</div>

        <div class="field">
          <label for="displayNameInput">display name</label>
          <input
            id="displayNameInput"
            maxlength="40"
            autocomplete="off"
          >
        </div>

        <div class="field">
          <label for="usernameInput">username</label>
          <input
            id="usernameInput"
            maxlength="30"
            autocomplete="off"
          >
        </div>

        <div class="field">
          <label for="bioInput">bio</label>
          <textarea
            id="bioInput"
            maxlength="300"
            placeholder="write something..."
          ></textarea>
        </div>

      </div>

      <div class="section">

        <div class="section-title">colors</div>

        <div class="color-row">

          <div class="color-control">
            <label for="pageColor">page color</label>
            <input
              id="pageColor"
              type="color"
              value="#101012"
            >
          </div>

          <div class="color-control">
            <label for="accentColor">accent color</label>
            <input
              id="accentColor"
              type="color"
              value="#f2a9c8"
            >
          </div>

        </div>

      </div>

      <div class="section">

        <div class="section-title">font</div>

        <div class="field">
          <select id="fontSelect">
            <option value="sans">manrope</option>
            <option value="serif">serif</option>
            <option value="mono">dm mono</option>
          </select>
        </div>

      </div>

      <div class="section">

        <div class="section-title">layout</div>

        <div class="layout-options">

          <button
            class="layout-option active"
            data-layout="soft"
          >
            soft
          </button>

          <button
            class="layout-option"
            data-layout="minimal"
          >
            minimal
          </button>

          <button
            class="layout-option"
            data-layout="boxed"
          >
            boxed
          </button>

        </div>

      </div>

      <button id="saveBtn" class="save">
        save changes
      </button>

      <div id="status" class="status"></div>

    </section>

    <aside class="preview-wrap">

      <div class="preview-label">
        live preview
      </div>

      <div
        id="profilePreview"
        class="preview"
      >

        <div
          id="previewBanner"
          class="preview-banner"
        ></div>

        <div class="preview-body">

          <div
            id="previewAvatar"
            class="preview-avatar"
          >
            k
          </div>

          <div
            id="previewName"
            class="preview-name"
          >
            your name
          </div>

          <div
            id="previewUsername"
            class="preview-username"
          >
            @username
          </div>

          <div
            id="previewBio"
            class="preview-bio"
          >
            your bio will appear here
          </div>

          <div class="preview-grid">
            <div class="preview-card"></div>
            <div class="preview-card"></div>
            <div class="preview-card"></div>
            <div class="preview-card"></div>
          </div>

        </div>

      </div>

    </aside>

  </div>

</main>

<div id="cropOverlay" class="crop-overlay">

  <div class="crop-box">

    <div id="cropTitle" class="crop-title">
      adjust image
    </div>

    <div id="cropArea" class="crop-area">
      <img id="cropImage" src="" alt="">
    </div>

    <input
      id="zoom"
      class="zoom"
      type="range"
      min="0.5"
      max="3"
      step="0.01"
      value="1"
    >

    <div class="crop-actions">
      <button id="cancelCrop">cancel</button>
      <button id="useCrop" class="use">use image</button>
    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
  "https://qadbabbfhrqcbmjrkuvw.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_enmLwzFK9xOIZGLVe-3BdA_P6F7kmNn";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

let currentUser = null;
let profileData = null;

let pendingFile = null;
let pendingType = null;

let cropScale = 1;
let cropX = 0;
let cropY = 0;

let dragging = false;
let dragStartX = 0;
let dragStartY = 0;
let startX = 0;
let startY = 0;

const $ = id =>
  document.getElementById(id);

async function init(){

  const { data:{ session } } =
    await supabaseClient.auth.getSession();

  if(!session){
    window.location.href = "auth.html";
    return;
  }

  currentUser = session.user;

  await loadProfile();
}

async function loadProfile(){

  const { data:profile, error } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id",currentUser.id)
      .maybeSingle();

  if(error){
    console.error(error);
    setStatus("couldn't load profile");
    return;
  }

  if(!profile){

    const username =
      currentUser.user_metadata?.username ||
      "user" + currentUser.id.slice(0,6);

    const displayName =
      currentUser.user_metadata?.display_name ||
      username;

    const { data:created,error:createError } =
      await supabaseClient
        .from("profiles")
        .insert({
          id:currentUser.id,
          username,
          display_name:displayName,
          bio:""
        })
        .select()
        .single();

    if(createError){
      console.error(createError);
      setStatus("couldn't create profile");
      return;
    }

    profileData = created;

  }else{
    profileData = profile;
  }

  fillForm();
}

function fillForm(){

  const p = profileData;

  $("displayNameInput").value =
    p.display_name || "";

  $("usernameInput").value =
    p.username || "";

  $("bioInput").value =
    p.bio || "";

  $("pageColor").value =
    validColor(p.page_color)
      ? p.page_color
      : "#101012";

  $("accentColor").value =
    validColor(p.accent_color)
      ? p.accent_color
      : "#f2a9c8";

  $("fontSelect").value =
    ["sans","serif","mono"].includes(p.font)
      ? p.font
      : "sans";

  setLayout(
    ["soft","minimal","boxed"].includes(p.layout)
      ? p.layout
      : "soft"
  );

  if(p.avatar_url){
    setPreview(
      $("avatarPreview"),
      p.avatar_url,
      "profile image"
    );

    setPreview(
      $("previewAvatar"),
      p.avatar_url,
      ""
    );
  }

  if(p.background_url){
    setPreview(
      $("bannerPreview"),
      p.background_url,
      "background image"
    );

    $("previewBanner").style.backgroundImage =
      `url("${p.background_url}")`;
  }

  updatePreview();
}

function validColor(value){

  return typeof value === "string" &&
    /^#[0-9a-f]{6}$/i.test(value);
}

function setPreview(element,url,fallback){

  element.style.backgroundImage =
    `url("${url}")`;

  element.textContent =
    fallback || "";

  if(element === $("previewAvatar")){
    element.style.backgroundSize = "cover";
    element.style.backgroundPosition = "center";
  }
}

function updatePreview(){

  const name =
    $("displayNameInput").value.trim() ||
    "your name";

  const username =
    $("usernameInput").value.trim() ||
    "username";

  const bio =
    $("bioInput").value.trim() ||
    "your bio will appear here";

  const accent =
    $("accentColor").value;

  $("previewName").textContent =
    name;

  $("previewUsername").textContent =
    "@" + username;

  $("previewBio").textContent =
    bio;

  $("profilePreview").style.color =
    $("pageColor").value;

  $("previewAvatar").style.borderColor =
    $("pageColor").value;

  document.documentElement.style.setProperty(
    "--accent",
    accent
  );

  $("previewUsername").style.color =
    accent;

  $("previewAvatar").style.color =
    accent;

  const font =
    $("fontSelect").value;

  if(font === "serif"){
    $("profilePreview").style.fontFamily =
      "Georgia,serif";
  }else if(font === "mono"){
    $("profilePreview").style.fontFamily =
      "'DM Mono',monospace";
  }else{
    $("profilePreview").style.fontFamily =
      "Manrope,sans-serif";
  }
}

function setLayout(layout){

  document
    .querySelectorAll(".layout-option")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.layout === layout
      );
    });
}

[
  "displayNameInput",
  "usernameInput",
  "bioInput",
  "pageColor",
  "accentColor",
  "fontSelect"
].forEach(id => {

  $(id).addEventListener(
    "input",
    updatePreview
  );

  $(id).addEventListener(
    "change",
    updatePreview
  );
});

document
  .querySelectorAll(".layout-option")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        setLayout(button.dataset.layout);
      }
    );
  });

$("avatarInput").addEventListener(
  "change",
  e => {

    const file =
      e.target.files?.[0];

    if(!file) return;

    openCrop(file,"avatar");
    e.target.value = "";
  }
);

$("bannerInput").addEventListener(
  "change",
  e => {

    const file =
      e.target.files?.[0];

    if(!file) return;

    openCrop(file,"banner");
    e.target.value = "";
  }
);

function openCrop(file,type){

  pendingFile = file;
  pendingType = type;

  $("cropTitle").textContent =
    type === "avatar"
      ? "adjust profile image"
      : "adjust background image";

  const reader =
    new FileReader();

  reader.onload = e => {

    $("cropImage").src =
      e.target.result;

    cropScale = 1;
    cropX = 0;
    cropY = 0;

    $("zoom").value = 1;

    $("cropOverlay").classList.add("open");

    requestAnimationFrame(
      positionCropImage
    );
  };

  reader.readAsDataURL(file);
}

function positionCropImage(){

  const img = $("cropImage");

  if(!img.naturalWidth) return;

  const area =
    $("cropArea");

  const areaWidth =
    area.clientWidth;

  const areaHeight =
    area.clientHeight;

  const baseScale =
    Math.max(
      areaWidth / img.naturalWidth,
      areaHeight / img.naturalHeight
    );

  const scale =
    baseScale * cropScale;

  img.style.width =
    img.naturalWidth * scale + "px";

  img.style.height =
    img.naturalHeight * scale + "px";

  img.style.left =
    (areaWidth - img.naturalWidth * scale) / 2 +
    cropX +
    "px";

  img.style.top =
    (areaHeight - img.naturalHeight * scale) / 2 +
    cropY +
    "px";
}

$("zoom").addEventListener(
  "input",
  () => {

    cropScale =
      Number($("zoom").value);

    positionCropImage();
  }
);

$("cropImage").addEventListener(
  "pointerdown",
  e => {

    dragging = true;

    dragStartX = e.clientX;
    dragStartY = e.clientY;

    startX = cropX;
    startY = cropY;

    $("cropImage").setPointerCapture(
      e.pointerId
    );
  }
);

$("cropImage").addEventListener(
  "pointermove",
  e => {

    if(!dragging) return;

    cropX =
      startX +
      (e.clientX - dragStartX);

    cropY =
      startY +
      (e.clientY - dragStartY);

    positionCropImage();
  }
);

$("cropImage").addEventListener(
  "pointerup",
  () => {
    dragging = false;
  }
);

$("cropImage").addEventListener(
  "pointercancel",
  () => {
    dragging = false;
  }
);

$("cancelCrop").addEventListener(
  "click",
  closeCrop
);

function closeCrop(){

  $("cropOverlay").classList.remove("open");

  $("cropImage").src = "";

  pendingFile = null;
  pendingType = null;
}

$("useCrop").addEventListener(
  "click",
  async () => {

    if(!pendingFile || !pendingType){
      closeCrop();
      return;
    }

    const file =
      await createCroppedFile(
        pendingFile,
        pendingType
      );

    if(!file){
      setStatus("couldn't process image");
      return;
    }

    if(pendingType === "avatar"){

      const localUrl =
        URL.createObjectURL(file);

      setPreview(
        $("avatarPreview"),
        localUrl,
        ""
      );

      setPreview(
        $("previewAvatar"),
        localUrl,
        ""
      );

    }else{

      const localUrl =
        URL.createObjectURL(file);

      setPreview(
        $("bannerPreview"),
        localUrl,
        ""
      );

      $("previewBanner").style.backgroundImage =
        `url("${localUrl}")`;
    }

    pendingFile = file;

    closeCrop();

    if(pendingType === "avatar"){
      window._pendingAvatar = file;
    }else{
      window._pendingBanner = file;
    }

    updatePreview();
  }
);

async function createCroppedFile(file,type){

  const image =
    new Image();

  const url =
    URL.createObjectURL(file);

  return new Promise(resolve => {

    image.onload = () => {

      const canvas =
        document.createElement("canvas");

      if(type === "avatar"){
        canvas.width = 800;
        canvas.height = 800;
      }else{
        canvas.width = 1600;
        canvas.height = 800;
      }

      const ctx =
        canvas.getContext("2d");

      const area =
        $("cropArea");

      const areaWidth =
        area.clientWidth;

      const areaHeight =
        area.clientHeight;

      const baseScale =
        Math.max(
          areaWidth / image.naturalWidth,
          areaHeight / image.naturalHeight
        );

      const scale =
        baseScale * cropScale;

      const drawnWidth =
        image.naturalWidth * scale;

      const drawnHeight =
        image.naturalHeight * scale;

      const left =
        (areaWidth - drawnWidth) / 2 +
        cropX;

      const top =
        (areaHeight - drawnHeight) / 2 +
        cropY;

      const sourceScaleX =
        canvas.width / areaWidth;

      const sourceScaleY =
        canvas.height / areaHeight;

      ctx.drawImage(
        image,
        -left * sourceScaleX,
        -top * sourceScaleY,
        drawnWidth * sourceScaleX,
        drawnHeight * sourceScaleY
      );

      canvas.toBlob(
        blob => {

          URL.revokeObjectURL(url);

          if(!blob){
            resolve(null);
            return;
          }

          resolve(
            new File(
              [blob],
              "kioku-image.jpg",
              {
                type:"image/jpeg",
                lastModified:Date.now()
              }
            )
          );
        },
        "image/jpeg",
        .9
      );
    };

    image.onerror = () => {
      URL.revokeObjectURL(url);
      resolve(null);
    };

    image.src = url;
  });
}

async function uploadImage(file,type){

  if(!file) return null;

  const folder =
    type === "avatar"
      ? "profile"
      : "banners";

  const path =
    `${folder}/${currentUser.id}-${Date.now()}.jpg`;

  const { error } =
    await supabaseClient
      .storage
      .from("avatars")
      .upload(
        path,
        file,
        {
          contentType:"image/jpeg",
          upsert:false
        }
      );

  if(error){
    console.error(error);
    throw error;
  }

  const { data } =
    supabaseClient
      .storage
      .from("avatars")
      .getPublicUrl(path);

  return data.publicUrl;
}

$("saveBtn").addEventListener(
  "click",
  saveProfile
);

async function saveProfile(){

  const username =
    $("usernameInput").value
      .trim()
      .toLowerCase();

  const displayName =
    $("displayNameInput").value.trim();

  const bio =
    $("bioInput").value.trim();

  if(!username){
    setStatus("username is required");
    return;
  }

  if(!/^[a-z0-9_.-]+$/.test(username)){
    setStatus(
      "username can only use letters, numbers, dots, hyphens, and underscores"
    );
    return;
  }

  $("saveBtn").disabled = true;
  setStatus("saving...");

  try{

    let avatarUrl =
      profileData.avatar_url || null;

    let bannerUrl =
      profileData.background_url || null;

    if(window._pendingAvatar){
      avatarUrl =
        await uploadImage(
          window._pendingAvatar,
          "avatar"
        );
    }

    if(window._pendingBanner){
      bannerUrl =
        await uploadImage(
          window._pendingBanner,
          "banner"
        );
    }

    const layout =
      document
        .querySelector(".layout-option.active")
        ?.dataset.layout ||
      "soft";

    const updates = {
      username,
      display_name:displayName,
      bio,
      avatar_url:avatarUrl,
      background_url:bannerUrl,
      page_color:$("pageColor").value,
      accent_color:$("accentColor").value,
      font:$("fontSelect").value,
      layout,
      updated_at:new Date().toISOString()
    };

    const { data,error } =
      await supabaseClient
        .from("profiles")
        .update(updates)
        .eq("id",currentUser.id)
        .select()
        .single();

    if(error){
      console.error(error);

      if(error.code === "23505"){
        setStatus(
          "that username is already taken"
        );
      }else{
        setStatus(
          error.message || "couldn't save profile"
        );
      }

      $("saveBtn").disabled = false;
      return;
    }

    profileData = data;

    window._pendingAvatar = null;
    window._pendingBanner = null;

    setStatus("saved");

    setTimeout(() => {
      window.location.href =
        "profile.html";
    },700);

  }catch(error){

    console.error(error);

    setStatus(
      "couldn't upload image"
    );

    $("saveBtn").disabled = false;
  }
}

function setStatus(message){
  $("status").textContent =
    message;
}

$("backBtn").addEventListener(
  "click",
  () => {
    window.location.href =
      "profile.html";
  }
);

init();
</script>
