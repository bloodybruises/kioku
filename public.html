<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>kioku 記憶 · profile</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#101012;
  --panel:#17171a;
  --text:#f4f1f3;
  --muted:#aaa3aa;
  --line:#ffffff1c;
  --soft:#ffffff0a;
  --accent:#f2a9c8;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font:300 13px Manrope,sans-serif;
}

button{
  font:inherit;
  color:inherit;
  cursor:pointer;
}

.topbar{
  height:76px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  padding:0 4vw;
  position:sticky;
  top:0;
  z-index:20;
  background:#101012e8;
  backdrop-filter:blur(18px);
}

.logo{
  color:var(--text);
  text-decoration:none;
  font:18px 'DM Mono',monospace;
}

.logo small{
  color:var(--accent);
  font-size:10px;
  margin-left:5px;
}

.back{
  margin-left:auto;
  border:1px solid var(--line);
  background:var(--soft);
  border-radius:999px;
  padding:9px 14px;
  font-size:11px;
}

.back:hover{
  color:var(--accent);
  border-color:#f2a9c84d;
  background:#f2a9c81c;
}

.profile{
  width:min(1200px,92vw);
  margin:auto;
  padding-bottom:80px;
}

.banner{
  height:260px;
  margin-top:22px;
  border:1px solid var(--line);
  border-radius:16px;
  background:
    radial-gradient(circle at 30% 30%,#f2a9c82b,transparent 35%),
    linear-gradient(135deg,#1d1b20,#111114);
  background-size:cover;
  background-position:center;
}

.profile-head{
  position:relative;
  margin-top:-48px;
  padding:0 28px;
}

.avatar{
  width:104px;
  height:104px;
  border-radius:50%;
  border:5px solid var(--bg);
  background:#252328;
  background-size:cover;
  background-position:center;
  display:grid;
  place-items:center;
  color:var(--accent);
  font:20px 'DM Mono',monospace;
}

.identity{
  margin-top:15px;
}

.display-name{
  font-size:27px;
  font-weight:300;
  letter-spacing:-.03em;
}

.username{
  margin-top:5px;
  color:var(--accent);
  font:11px 'DM Mono',monospace;
}

.bio{
  max-width:600px;
  color:var(--muted);
  line-height:1.7;
  margin-top:13px;
  white-space:pre-wrap;
}

.actions{
  margin-top:18px;
  display:flex;
  gap:8px;
}

.follow{
  border:1px solid var(--accent);
  background:var(--accent);
  color:#171217;
  border-radius:999px;
  padding:9px 19px;
  font-size:11px;
}

.follow.following{
  background:transparent;
  color:var(--accent);
}

.stats{
  display:flex;
  gap:24px;
  margin-top:20px;
  color:var(--muted);
  font:10px 'DM Mono',monospace;
  text-transform:uppercase;
  letter-spacing:.08em;
}

.stats strong{
  color:var(--text);
  font-weight:400;
}

.profile-nav{
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  margin-top:30px;
  display:flex;
  gap:25px;
}

.profile-nav button{
  border:0;
  background:none;
  color:var(--muted);
  padding:15px 0;
  font:10px 'DM Mono',monospace;
  text-transform:uppercase;
  letter-spacing:.1em;
}

.profile-nav button.active,
.profile-nav button:hover{
  color:var(--accent);
  border-bottom:1px solid var(--accent);
}

#postGrid{
  columns:4 220px;
  column-gap:15px;
  margin-top:18px;
}

.card{
  break-inside:avoid;
  margin-bottom:15px;
  position:relative;
  overflow:hidden;
  border-radius:10px;
  background:#19191c;
  cursor:pointer;
}

.card img{
  display:block;
  width:100%;
  transition:.5s;
}

.card:hover img{
  transform:scale(1.025);
  filter:brightness(.82);
}

.card-info{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:55px 14px 13px;
  background:linear-gradient(transparent,#000d);
  opacity:0;
  transition:.2s;
}

.card:hover .card-info{
  opacity:1;
}

.card-title{
  font-size:12px;
}

.card-tags{
  color:#c6c1c5;
  margin-top:5px;
  font:9px 'DM Mono',monospace;
}

.empty,
.loading{
  text-align:center;
  color:var(--muted);
  padding:90px 20px;
  font:10px 'DM Mono',monospace;
  text-transform:uppercase;
  letter-spacing:.1em;
}

.overlay{
  position:fixed;
  inset:0;
  z-index:50;
  background:#08080bf5;
  backdrop-filter:blur(20px);
  padding:7vh 5vw;
  overflow:auto;
}

.overlay[hidden]{
  display:none;
}

.close{
  position:fixed;
  right:25px;
  top:18px;
  background:none;
  border:0;
  font-size:30px;
  color:#aaa;
}

.viewer{
  width:min(1050px,92vw);
  margin:auto;
}

.viewer img{
  display:block;
  max-width:100%;
  max-height:72vh;
  width:auto;
  margin:auto;
}

.viewer-info{
  border-top:1px solid var(--line);
  margin-top:18px;
  padding-top:16px;
}

.viewer-info h2{
  font-weight:300;
  margin:0 0 7px;
}

.viewer-info p{
  color:var(--muted);
  line-height:1.7;
}

.viewer-tags{
  color:#c6c1c5;
  font:9px 'DM Mono',monospace;
}

@media(max-width:720px){
  .topbar{
    padding:0 3vw;
  }

  .banner{
    height:190px;
    margin-top:12px;
    border-radius:11px;
  }

  .profile-head{
    padding:0 15px;
    margin-top:-40px;
  }

  .avatar{
    width:82px;
    height:82px;
    border-width:4px;
  }

  .display-name{
    font-size:23px;
  }

  #postGrid{
    columns:2 145px;
    column-gap:9px;
  }

  .card{
    margin-bottom:9px;
    border-radius:7px;
  }

  .card-info{
    display:none;
  }
}
</style>
</head>

<body>

<header class="topbar">
  <a class="logo" href="index.html">
    kioku <small>記憶</small>
  </a>

  <button class="back" id="backBtn">home</button>
</header>

<main class="profile">

  <div id="banner" class="banner"></div>

  <section class="profile-head">

    <div id="avatar" class="avatar">k</div>

    <div class="identity">
      <div id="displayName" class="display-name">loading...</div>
      <div id="username" class="username">@loading</div>
      <div id="bio" class="bio"></div>

      <div class="actions">
        <button id="followBtn" class="follow">follow</button>
      </div>
    </div>

    <div class="stats">
      <span><strong id="postCount">0</strong> posts</span>
      <span><strong id="followerCount">0</strong> followers</span>
      <span><strong id="followingCount">0</strong> following</span>
    </div>

  </section>

  <nav class="profile-nav">
    <button class="active" data-tab="posts">posts</button>
    <button data-tab="collections">collections</button>
    <button data-tab="saved">saved</button>
  </nav>

  <section>
    <div id="loading" class="loading">loading profile...</div>
    <div id="postGrid"></div>
    <div id="empty" class="empty" hidden></div>
  </section>

</main>

<div id="viewer" class="overlay" hidden>
  <button class="close" id="closeViewer">×</button>

  <div class="viewer">
    <img id="viewerImage" src="" alt="">

    <div class="viewer-info">
      <h2 id="viewerTitle"></h2>
      <p id="viewerDescription"></p>
      <div id="viewerTags" class="viewer-tags"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
  "https://qadbabbfhrqcbmjrkuvw.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_enmLwzFK9xOIZGLVe-3BdA_P6F7kmNn";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

let profileData = null;
let currentPosts = [];
let isFollowing = false;

const $ = id => document.getElementById(id);

async function init(){

  const params =
    new URLSearchParams(window.location.search);

  const requestedUsername =
    params.get("username");

  if(!requestedUsername){
    $("loading").hidden = true;
    $("empty").hidden = false;
    $("empty").textContent =
      "no username provided";
    return;
  }

  await loadPublicProfile(requestedUsername);
}

async function loadPublicProfile(username){

  const { data:profile, error } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("username", username)
      .maybeSingle();

  if(error){
    console.error(error);
    showError();
    return;
  }

  if(!profile){
    $("loading").hidden = true;
    $("empty").hidden = false;
    $("empty").textContent =
      "profile not found";
    return;
  }

  profileData = profile;

  applyProfile();
  await loadPosts();
}

function applyProfile(){

  const p = profileData;

  document.title =
    `${p.display_name || p.username} · kioku`;

  $("displayName").textContent =
    p.display_name || p.username;

  $("username").textContent =
    "@" + p.username;

  $("bio").textContent =
    p.bio || "";

  document.documentElement.style.setProperty(
    "--accent",
    p.accent_color || "#f2a9c8"
  );

  if(p.page_color){
    document.body.style.background =
      p.page_color;
  }

  if(p.font === "serif"){
    document.body.style.fontFamily =
      "Georgia,serif";
  }else if(p.font === "mono"){
    document.body.style.fontFamily =
      "'DM Mono',monospace";
  }else{
    document.body.style.fontFamily =
      "Manrope,sans-serif";
  }

  if(p.background_url){
    $("banner").style.backgroundImage =
      `url("${p.background_url}")`;
  }

  if(p.avatar_url){
    $("avatar").textContent = "";
    $("avatar").style.backgroundImage =
      `url("${p.avatar_url}")`;
  }else{
    $("avatar").textContent =
      (p.display_name || p.username || "k")
        .charAt(0)
        .toLowerCase();
  }
}

async function loadPosts(){

  const { data:posts, error } =
    await supabaseClient
      .from("posts")
      .select("*")
      .eq("user_id", profileData.id)
      .order("created_at",{ascending:false});

  $("loading").hidden = true;

  if(error){
    console.error(error);
    showError();
    return;
  }

  currentPosts = posts || [];

  $("postCount").textContent =
    currentPosts.length;

  renderPosts();
}

function renderPosts(){

  $("postGrid").innerHTML = "";

  if(!currentPosts.length){
    $("empty").hidden = false;
    $("empty").textContent =
      "no posts yet";
    return;
  }

  $("empty").hidden = true;

  currentPosts.forEach(post => {

    const card =
      document.createElement("article");

    card.className = "card";

    const img =
      document.createElement("img");

    img.src = post.image_url;
    img.alt = post.title || "kioku photo";
    img.loading = "lazy";

    const info =
      document.createElement("div");

    info.className = "card-info";

    const title =
      document.createElement("div");

    title.className = "card-title";
    title.textContent =
      post.title || "untitled";

    const tags =
      document.createElement("div");

    tags.className = "card-tags";

    tags.textContent =
      Array.isArray(post.tags)
        ? post.tags.map(t => "#" + t).join(" ")
        : "";

    info.append(title,tags);
    card.append(img,info);

    card.addEventListener(
      "click",
      () => openViewer(post)
    );

    $("postGrid").appendChild(card);
  });
}

function openViewer(post){

  $("viewerImage").src =
    post.image_url;

  $("viewerTitle").textContent =
    post.title || "untitled";

  $("viewerDescription").textContent =
    post.description || "";

  $("viewerTags").textContent =
    Array.isArray(post.tags)
      ? post.tags.map(t => "#" + t).join(" ")
      : "";

  $("viewer").hidden = false;
  document.body.style.overflow = "hidden";
}

function closeViewer(){

  $("viewer").hidden = true;
  $("viewerImage").src = "";
  document.body.style.overflow = "";
}

function showError(){

  $("loading").hidden = true;
  $("empty").hidden = false;
  $("empty").textContent =
    "something went wrong";
}

$("closeViewer").addEventListener(
  "click",
  closeViewer
);

$("viewer").addEventListener(
  "click",
  e => {
    if(e.target === $("viewer")){
      closeViewer();
    }
  }
);

document.addEventListener(
  "keydown",
  e => {
    if(e.key === "Escape"){
      closeViewer();
    }
  }
);

$("backBtn").addEventListener(
  "click",
  () => {
    window.location.href =
      "index.html";
  }
);

$("followBtn").addEventListener(
  "click",
  () => {

    isFollowing = !isFollowing;

    $("followBtn").textContent =
      isFollowing
        ? "following"
        : "follow";

    $("followBtn").classList.toggle(
      "following",
      isFollowing
    );

    $("followerCount").textContent =
      isFollowing
        ? "1"
        : "0";
  }
);

document
  .querySelectorAll(".profile-nav button")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll(".profile-nav button")
          .forEach(b =>
            b.classList.remove("active")
          );

        button.classList.add("active");

        const tab =
          button.dataset.tab;

        if(tab === "posts"){
          renderPosts();
          return;
        }

        $("postGrid").innerHTML = "";
        $("empty").hidden = false;

        $("empty").textContent =
          tab === "collections"
            ? "collections are coming soon"
            : "saved posts are coming soon";
      }
    );
  });

init();
</script>

</body>
</html>
