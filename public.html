<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>kioku 記憶 — profile</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: #222;
      background: #efedef;
      font-family: Arial, sans-serif;
      transition: background .3s ease;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
    }

    .topbar {
      height: 64px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,.76);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(0,0,0,.06);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .logo {
      font-size: 20px;
      letter-spacing: .04em;
    }

    .back {
      font-size: 13px;
      color: #555;
    }

    .page {
      width: min(1000px, calc(100% - 28px));
      margin: 28px auto 70px;
    }

    .profile {
      overflow: hidden;
      border-radius: 24px;
      background: rgba(255,255,255,.74);
      border: 1px solid rgba(0,0,0,.07);
    }

    .banner {
      height: 280px;
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .profileInfo {
      padding: 0 36px 32px;
      position: relative;
    }

    .avatar {
      width: 130px;
      height: 130px;
      object-fit: cover;
      border-radius: 50%;
      margin-top: -65px;
      border: 6px solid rgba(255,255,255,.95);
      background: #ddd;
      display: block;
    }

    .nameRow {
      margin-top: 18px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
    }

    .name {
      font-size: 28px;
      font-weight: 500;
      margin: 0;
    }

    .username {
      color: #888;
      font-size: 14px;
      margin-top: 5px;
    }

    .bio {
      max-width: 620px;
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.65;
      white-space: pre-wrap;
    }

    .follow {
      border: 0;
      padding: 11px 22px;
      border-radius: 999px;
      cursor: pointer;
      background: #222;
      color: white;
      font-size: 13px;
      white-space: nowrap;
    }

    .follow.following {
      background: transparent;
      color: #222;
      border: 1px solid rgba(0,0,0,.18);
    }

    .stats {
      display: flex;
      gap: 25px;
      margin-top: 22px;
      font-size: 13px;
      color: #666;
    }

    .stats strong {
      color: #222;
      font-weight: 500;
    }

    .tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 0 20px;
      border-top: 1px solid rgba(0,0,0,.06);
      border-bottom: 1px solid rgba(0,0,0,.06);
    }

    .tab {
      border: 0;
      background: none;
      padding: 18px 22px;
      cursor: pointer;
      font-size: 13px;
      color: #888;
      position: relative;
    }

    .tab.active {
      color: #222;
    }

    .tab.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 20%;
      right: 20%;
      height: 2px;
      background: currentColor;
    }

    .content {
      padding: 28px;
    }

    .masonry {
      columns: 3 240px;
      column-gap: 18px;
    }

    .photo {
      break-inside: avoid;
      margin-bottom: 18px;
      border-radius: 16px;
      overflow: hidden;
      background: #ddd;
      cursor: pointer;
      position: relative;
    }

    .photo img {
      width: 100%;
      height: auto;
      display: block;
    }

    .photoInfo {
      padding: 12px;
      background: rgba(255,255,255,.88);
    }

    .photoTitle {
      font-size: 13px;
    }

    .photoStats {
      margin-top: 6px;
      font-size: 11px;
      color: #888;
    }

    .empty {
      text-align: center;
      padding: 80px 20px;
      color: #888;
      font-size: 14px;
    }

    .error {
      text-align: center;
      padding: 100px 20px;
      color: #777;
    }

    .error strong {
      display: block;
      color: #222;
      margin-bottom: 8px;
    }

    .minimal {
      border-radius: 0;
      background: transparent;
      border: 0;
    }

    .minimal .profileInfo {
      padding-left: 10px;
      padding-right: 10px;
    }

    .minimal .tabs {
      border-left: 0;
      border-right: 0;
    }

    .boxed {
      border-radius: 8px;
    }

    .boxed .photo {
      border-radius: 6px;
    }

    @media (max-width: 650px) {

      .topbar {
        padding: 0 16px;
      }

      .page {
        width: 100%;
        margin-top: 0;
      }

      .profile {
        border-radius: 0;
        border-left: 0;
        border-right: 0;
      }

      .banner {
        height: 190px;
      }

      .profileInfo {
        padding: 0 20px 26px;
      }

      .avatar {
        width: 105px;
        height: 105px;
        margin-top: -52px;
      }

      .nameRow {
        display: block;
      }

      .follow {
        margin-top: 18px;
      }

      .tabs {
        overflow-x: auto;
        justify-content: flex-start;
      }

      .tab {
        flex-shrink: 0;
      }

      .content {
        padding: 16px;
      }

      .masonry {
        columns: 2 150px;
        column-gap: 10px;
      }

      .photo {
        margin-bottom: 10px;
        border-radius: 10px;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <a class="logo" href="index.html">
      kioku 記憶
    </a>

    <a class="back" href="index.html">
      ← home
    </a>
  </header>


  <main class="page">

    <div id="profile" class="profile">

      <div id="banner" class="banner"></div>

      <section class="profileInfo">

        <img
          id="avatar"
          class="avatar"
          alt="profile picture"
        >

        <div class="nameRow">

          <div>

            <h1 id="name" class="name">
              loading...
            </h1>

            <div id="username" class="username"></div>

          </div>

          <button
            id="follow"
            class="follow"
            type="button"
          >
            follow
          </button>

        </div>

        <div id="bio" class="bio"></div>

        <div class="stats">

          <span>
            <strong id="followers">0</strong>
            followers
          </span>

          <span>
            <strong id="following">0</strong>
            following
          </span>

        </div>

      </section>


      <nav class="tabs">

        <button
          class="tab active"
          data-tab="posts"
        >
          posts
        </button>

        <button
          class="tab"
          data-tab="collections"
        >
          collections
        </button>

        <button
          class="tab"
          data-tab="saved"
        >
          saved
        </button>

      </nav>


      <section class="content">

        <div id="posts" class="masonry"></div>

        <div id="empty" class="empty" style="display:none;">
          nothing here yet.
        </div>

      </section>

    </div>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://qadbabbfhrqcbmjrkuvw.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_enmLwzFK9xOIZGLVe-3BdA_P6F7kmNn";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    const $ = id =>
      document.getElementById(id);


    const params =
      new URLSearchParams(window.location.search);

    const requestedUsername =
      params.get("username");


    const defaults = [
      {
        src: "assets/clouds.jpg",
        title: "between weather",
        likes: 0
      },
      {
        src: "assets/purple-glow.jpg",
        title: "violet static",
        likes: 0
      },
      {
        src: "assets/purple-architecture.jpg",
        title: "afterimage",
        likes: 0
      },
      {
        src: "assets/night-trails.jpg",
        title: "somewhere above",
        likes: 0
      },
      {
        src: "assets/night-sky.jpg",
        title: "02:17",
        likes: 0
      },
      {
        src: "assets/night-blue.jpg",
        title: "blue hour",
        likes: 0
      }
    ];


    function applyFont(font) {

      if (font === "serif") {

        document.body.style.fontFamily =
          "Georgia, serif";

      } else if (font === "mono") {

        document.body.style.fontFamily =
          "monospace";

      } else {

        document.body.style.fontFamily =
          "Arial, sans-serif";
      }
    }


    function applyLayout(layout) {

      $("profile").classList.remove(
        "minimal",
        "boxed"
      );

      if (layout === "minimal") {

        $("profile").classList.add(
          "minimal"
        );

      } else if (layout === "boxed") {

        $("profile").classList.add(
          "boxed"
        );
      }
    }


    function renderPhotos() {

      const container = $("posts");

      container.innerHTML = "";

      if (!defaults.length) {

        $("empty").style.display =
          "block";

        return;
      }

      $("empty").style.display =
        "none";


      defaults.forEach(photo => {

        const card =
          document.createElement("article");

        card.className = "photo";

        card.innerHTML = `

          <img
            src="${photo.src}"
            alt="${photo.title}"
            loading="lazy"
          >

          <div class="photoInfo">

            <div class="photoTitle">
              ${photo.title}
            </div>

            <div class="photoStats">
              ♡ ${photo.likes}
            </div>

          </div>

        `;

        container.appendChild(card);

      });
    }


    async function loadProfile() {

      if (!requestedUsername) {

        $("name").textContent =
          "profile not found";

        $("username").textContent =
          "";

        $("follow").style.display =
          "none";

        return;
      }


      const cleanUsername =
        requestedUsername
          .replace(/^@/, "")
          .trim();


      const { data, error } =
        await supabaseClient
          .from("profiles")
          .select("*")
          .eq("username", cleanUsername)
          .maybeSingle();


      if (error) {

        console.error(error);

        $("name").textContent =
          "something went wrong";

        $("username").textContent =
          error.message;

        $("follow").style.display =
          "none";

        return;
      }


      if (!data) {

        $("name").textContent =
          "profile not found";

        $("username").textContent =
          "@" + cleanUsername;

        $("follow").style.display =
          "none";

        return;
      }


      document.title =
        `kioku 記憶 — ${data.display_name}`;


      $("name").textContent =
        data.display_name || data.username;


      $("username").textContent =
        "@" + data.username;


      $("bio").textContent =
        data.bio || "";


      if (data.avatar_url) {

        $("avatar").src =
          data.avatar_url;

      } else {

        $("avatar").style.display =
          "none";
      }


      if (data.background_url) {

        $("banner").style.backgroundImage =
          `url("${data.background_url}")`;

      } else {

        $("banner").style.background =
          `linear-gradient(
            135deg,
            ${data.page_color || "#efedef"},
            ${data.accent_color || "#e8b8cb"}
          )`;
      }


      document.body.style.background =
        data.page_color || "#efedef";


      applyFont(
        data.font || "sans"
      );


      applyLayout(
        data.layout || "soft"
      );


      $("follow").style.background =
        data.accent_color || "#222";


      renderPhotos();

    }


    document.querySelectorAll(".tab")
      .forEach(tab => {

        tab.addEventListener(
          "click",
          () => {

            document.querySelectorAll(".tab")
              .forEach(t =>
                t.classList.remove("active")
              );

            tab.classList.add("active");


            const type =
              tab.dataset.tab;


            if (type === "posts") {

              renderPhotos();

            } else {

              $("posts").innerHTML = "";

              $("empty").style.display =
                "block";

              $("empty").textContent =
                type === "collections"
                  ? "collections will appear here."
                  : "saved posts will appear here.";
            }

          }
        );

      });


    loadProfile();

  </script>

</body>
</html>
