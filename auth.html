<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>kioku 記憶 — account</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #efedef;
      color: #222;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .box {
      width: 100%;
      max-width: 430px;
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(0,0,0,.08);
      padding: 32px;
      border-radius: 22px;
      box-shadow: 0 12px 40px rgba(0,0,0,.06);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
      font-weight: 500;
    }

    .sub {
      margin: 0 0 28px;
      color: #777;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-size: 13px;
      color: #555;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d8d3d7;
      border-radius: 12px;
      background: #fff;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #d49ab3;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #e8b8cb;
      color: #222;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    .switch {
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
      color: #777;
    }

    .switch button {
      width: auto;
      margin: 0;
      padding: 0;
      background: none;
      color: #a85f7e;
    }

    #message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      background: #f4e1e8;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1 id="title">create account</h1>

    <p class="sub">
      make a little space for everything swirling within.
    </p>

    <form id="authForm">

      <div id="signupFields">

        <label for="username">username</label>
        <input
          id="username"
          type="text"
          placeholder="username"
          autocomplete="username"
        >

        <label for="displayName">display name</label>
        <input
          id="displayName"
          type="text"
          placeholder="your name"
        >

      </div>

      <label for="email">email</label>
      <input
        id="email"
        type="email"
        placeholder="you@example.com"
        autocomplete="email"
        required
      >

      <label for="password">password</label>
      <input
        id="password"
        type="password"
        placeholder="at least 6 characters"
        autocomplete="new-password"
        required
      >

      <button id="submitButton" type="submit">
        create account
      </button>

    </form>

    <div id="message"></div>

    <div class="switch">
      <span id="switchText">already have an account?</span>
      <button id="switchButton" type="button">log in</button>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://qadbabbfhrqcbmjrkuvw.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_enmLwzFK9xOIZGLVe-3BdA_P6F7kmNn";

    let supabaseClient = null;

    const message = document.getElementById("message");
    const form = document.getElementById("authForm");
    const submitButton = document.getElementById("submitButton");
    const switchButton = document.getElementById("switchButton");

    const title = document.getElementById("title");
    const signupFields = document.getElementById("signupFields");
    const switchText = document.getElementById("switchText");

    let loginMode = false;

    function showMessage(text) {
      message.textContent = text;
      message.style.display = "block";
    }

    function hideMessage() {
      message.style.display = "none";
    }

    function setMode(login) {

      loginMode = login;
      hideMessage();

      if (loginMode) {

        title.textContent = "log in";
        signupFields.style.display = "none";
        submitButton.textContent = "log in";

        switchText.textContent = "don't have an account?";
        switchButton.textContent = "create one";

        document.getElementById("password").autocomplete = "current-password";

      } else {

        title.textContent = "create account";
        signupFields.style.display = "block";
        submitButton.textContent = "create account";

        switchText.textContent = "already have an account?";
        switchButton.textContent = "log in";

        document.getElementById("password").autocomplete = "new-password";
      }
    }

    switchButton.addEventListener("click", function() {
      setMode(!loginMode);
    });


    async function init() {

      try {

        if (!window.supabase) {
          showMessage(
            "Supabase failed to load. Check your internet connection and reload the page."
          );
          return;
        }

        supabaseClient = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_PUBLISHABLE_KEY
        );

        console.log("Supabase initialized");

      } catch (error) {

        console.error(error);

        showMessage(
          "Supabase setup error: " + error.message
        );
      }
    }


    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      hideMessage();

      if (!supabaseClient) {

        showMessage(
          "The account system hasn't loaded yet. Please reload the page."
        );

        return;
      }

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      submitButton.disabled = true;
      submitButton.textContent =
        loginMode ? "logging in..." : "creating account...";

      try {

        if (loginMode) {

          const { data, error } =
            await supabaseClient.auth.signInWithPassword({
              email: email,
              password: password
            });

          if (error) {
            throw error;
          }

          if (data.session) {

            window.location.href = "profile.html";

          } else {

            showMessage(
              "You logged in, but no session was created."
            );
          }

        } else {

          const username =
            document.getElementById("username").value
              .trim()
              .replace(/^@/, "");

          const displayName =
            document.getElementById("displayName").value.trim();

          if (!username) {
            showMessage("Please choose a username.");
            return;
          }

          if (!displayName) {
            showMessage("Please enter a display name.");
            return;
          }

          if (password.length < 6) {
            showMessage("Your password needs to be at least 6 characters.");
            return;
          }

          console.log("Attempting signup...");

          const { data, error } =
            await supabaseClient.auth.signUp({

              email: email,

              password: password,

              options: {
                emailRedirectTo:
                  "https://bloodybruises.github.io/kioku/profile.html",

                data: {
                  username: username,
                  display_name: displayName
                }
              }

            });

          console.log("Signup response:", data);

          if (error) {
            throw error;
          }

          if (data.session) {

            window.location.href = "profile.html";

          } else {

            showMessage(
              "Account created! Check your email for the confirmation link, then come back and log in."
            );

          }
        }

      } catch (error) {

        console.error("AUTH ERROR:", error);

        showMessage(
          "Account error: " + (error.message || "Something went wrong.")
        );

      } finally {

        submitButton.disabled = false;
        submitButton.textContent =
          loginMode ? "log in" : "create account";
      }

    });


    init();

  </script>

</body>
</html>
