<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>kioku 記憶</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      background: #fff;
      color: #222;

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }


    /* ================================
       HEADER
    ================================= */

    .header {
      width: 100%;

      padding: 18px 22px 15px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border-bottom: 1px solid #e8e8e8;

      background: #fff;

      position: sticky;
      top: 0;
      z-index: 100;
    }


    /* ================================
       LOGO
    ================================= */

    .logo {
      display: flex;
      align-items: baseline;

      gap: 6px;

      color: #222;

      text-decoration: none;
    }

    .logo-main {
      font-size: 21px;
      font-weight: 500;

      letter-spacing: .04em;
    }

    .logo-japanese {
      font-size: 13px;

      opacity: .55;
    }


    /* ================================
       HEADER BUTTONS
    ================================= */

    .header-actions {
      display: flex;
      align-items: center;

      gap: 8px;
    }

    .header-button {
      height: 31px;

      padding: 0 11px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid #cfcfcf;

      background: #fff;
      color: #222;

      cursor: pointer;

      font-size: 11px;

      letter-spacing: .03em;

      transition:
        background .15s ease,
        border-color .15s ease;
    }

    .header-button:hover {
      background: #f5f5f5;
      border-color: #999;
    }


    .add-button {
      width: 31px;
      padding: 0;

      font-size: 18px;

      line-height: 1;
    }


    /* ================================
       SEARCH
    ================================= */

    .search-area {
      width: 100%;

      padding: 16px 22px 5px;

      display: flex;
      justify-content: center;
    }

    .search {
      width: min(520px, 100%);

      height: 37px;

      border: 1px solid #ddd;

      background: #fafafa;

      padding: 0 13px;

      outline: none;

      font: inherit;

      font-size: 12px;

      color: #222;
    }

    .search:focus {
      border-color: #aaa;
      background: #fff;
    }


    /* ================================
       GALLERY
    ================================= */

    .gallery-wrapper {
      width: 100%;

      padding: 17px 20px 60px;
    }


    .gallery {
      width: 100%;

      max-width: 1400px;

      margin: 0 auto;

      column-count: 4;

      column-gap: 14px;
    }


    /* ================================
       PHOTO CARD
    ================================= */

    .photo-card {
      display: inline-block;

      width: 100%;

      margin: 0 0 14px;

      vertical-align: top;

      break-inside: avoid;
      page-break-inside: avoid;

      cursor: pointer;

      position: relative;

      background: #f3f3f3;

      overflow: hidden;
    }


    .photo-card img {
      display: block;

      width: 100%;

      height: auto;

      max-width: 100%;

      object-fit: contain;

      vertical-align: middle;

      transition:
        transform .25s ease,
        opacity .25s ease;
    }


    .photo-card:hover img {
      transform: scale(1.015);

      opacity: .92;
    }


    /* ================================
       PHOTO INFO
    ================================= */

    .photo-info {
      padding: 9px 2px 3px;

      background: #fff;
    }

    .photo-title {
      font-size: 11px;

      line-height: 1.4;

      color: #333;
    }

    .photo-tags {
      display: flex;

      flex-wrap: wrap;

      gap: 5px;

      margin-top: 4px;
    }

    .photo-tags span {
      font-size: 9px;

      color: #999;
    }


    /* ================================
       EMPTY
    ================================= */

    #empty {
      display: none;

      text-align: center;

      padding: 80px 20px;

      color: #888;

      font-size: 12px;
    }


    /* ================================
       VIEWER
    ================================= */

    #viewer {
      position: fixed;

      inset: 0;

      z-index: 1000;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 20px;

      background: rgba(255,255,255,.96);

      cursor: pointer;
    }


    #viewer img {
      display: block;

      max-width: 92vw;
      max-height: 82vh;

      width: auto;
      height: auto;

      object-fit: contain;

      box-shadow:
        0 8px 35px rgba(0,0,0,.15);

      cursor: default;
    }


    .viewer-content {
      max-width: 92vw;
      max-height: 90vh;

      display: flex;
      flex-direction: column;

      align-items: center;

      cursor: default;
    }


    .viewer-title {
      margin-top: 13px;

      font-size: 12px;

      color: #222;
    }


    .viewer-description {
      margin-top: 4px;

      max-width: 600px;

      text-align: center;

      font-size: 11px;

      color: #888;
    }


    .viewer-close {
      position: fixed;

      top: 17px;
      right: 20px;

      width: 32px;
      height: 32px;

      border: 1px solid #ccc;

      background: #fff;

      font-size: 20px;

      line-height: 1;

      cursor: pointer;
    }


    /* ================================
       MOBILE
    ================================= */

    @media (max-width: 800px) {

      .header {
        padding:
          15px
          14px
          13px;
      }


      .logo-main {
        font-size: 19px;
      }


      .logo-japanese {
        font-size: 12px;
      }


      .header-actions {
        gap: 6px;
      }


      .header-button {
        height: 30px;

        padding:
          0 9px;

        font-size: 10px;
      }


      .add-button {
        width: 30px;

        padding: 0;

        font-size: 17px;
      }


      .search-area {
        padding:
          13px
          14px
          3px;
      }


      .gallery-wrapper {
        padding:
          13px
          10px
          45px;
      }


      .gallery {
        column-count: 2;

        column-gap: 8px;
      }


      .photo-card {
        margin-bottom: 8px;
      }


      .photo-info {
        padding:
          7px
          1px
          2px;
      }


      .photo-title {
        font-size: 10px;
      }


      .photo-tags span {
        font-size: 8px;
      }

    }


    /* ================================
       VERY SMALL PHONES
    ================================= */

    @media (max-width: 360px) {

      .gallery {
        column-gap: 7px;
      }

      .photo-card {
        margin-bottom: 7px;
      }

    }

  </style>

</head>


<body>


  <!-- ================================
       HEADER
  ================================= -->

  <header class="header">

    <a
      href="index.html"
      class="logo"
    >

      <span class="logo-main">
        kioku
      </span>

      <span class="logo-japanese">
        記憶
      </span>

    </a>


    <div class="header-actions">

      <button
        class="header-button"
        id="profileBtn"
      >
        log in
      </button>


      <button
        class="header-button add-button"
        id="add"
        aria-label="add photo"
      >
        +
      </button>

    </div>

  </header>


  <!-- ================================
       SEARCH
  ================================= -->

  <div class="search-area">

    <input
      id="search"
      class="search"
      type="search"
      placeholder="search memories..."
      autocomplete="off"
    >

  </div>


  <!-- ================================
       GALLERY
  ================================= -->

  <main class="gallery-wrapper">

    <div
      id="gallery"
      class="gallery"
    ></div>


    <div id="empty">

      nothing here yet.

    </div>

  </main>


  <!-- ================================
       VIEWER
  ================================= -->

  <div
    id="viewer"
  >

    <button
      id="viewerClose"
      class="viewer-close"
    >
      ×
    </button>


    <div
      class="viewer-content"
      id="viewerContent"
    >

      <img
        id="viewerImage"
        src=""
        alt=""
      >


      <div
        class="viewer-title"
        id="viewerTitle"
      ></div>


      <div
        class="viewer-description"
        id="viewerDescription"
      ></div>

    </div>

  </div>


  <!-- ================================
       APP
  ================================= -->

  <script src="app.js"></script>


</body>

</html>
