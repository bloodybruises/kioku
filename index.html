<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>kioku 記憶</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #ffffff;
      color: #222;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    /* =========================
       HOME HEADER
    ========================= */

    header {
      width: 100%;
      height: 68px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 18px;

      background: #ffffff;
      border-bottom: 1px solid #eeeeee;

      position: sticky;
      top: 0;
      z-index: 50;
    }

    .logo {
      color: #222;
      text-decoration: none;

      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.4px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-button {
      height: 34px;
      min-width: 34px;

      padding: 0 11px;

      border: 1px solid #d7d7d7;
      border-radius: 9px;

      background: #ffffff;
      color: #222;

      font-size: 13px;

      cursor: pointer;
    }

    .header-button:hover {
      background: #f7f7f7;
    }

    .add-button {
      width: 34px;
      min-width: 34px;

      padding: 0;

      font-size: 20px;
      line-height: 1;
    }

    /* =========================
       SEARCH
    ========================= */

    .search-area {
      width: 100%;
      padding: 14px 18px 8px;
    }

    #search {
      width: 100%;
      max-width: 520px;
      height: 38px;

      padding: 0 13px;

      border: 1px solid #dddddd;
      border-radius: 10px;

      background: #fafafa;
      color: #222;

      font-size: 13px;

      outline: none;
    }

    #search:focus {
      background: #ffffff;
      border-color: #cdb3c0;
    }

    /* =========================
       HOME GALLERY
    ========================= */

    #gallery {
      width: 100%;

      padding: 10px 14px 35px;

      column-count: 3;
      column-gap: 12px;
    }

    .photo-card {
      width: 100%;

      display: inline-block;
      vertical-align: top;

      margin: 0 0 16px;

      break-inside: avoid;
      -webkit-column-break-inside: avoid;

      cursor: pointer;
    }

    .photo-card img {
      display: block;

      width: 100%;
      height: auto;

      border-radius: 9px;

      background: #f1f1f1;

      object-fit: cover;

      transition: opacity 0.15s ease;
    }

    .photo-card:hover img {
      opacity: 0.91;
    }

    /* TITLE STAYS VISIBLE ON HOME */

    .photo-title {
      display: block !important;

      margin: 7px 2px 0;

      color: #333;

      font-size: 12px;
      line-height: 1.35;
    }

    /* TAGS STAY HIDDEN ON HOME */

    .photo-tags,
    .tags,
    .hashtags {
      display: none !important;
    }

    /* =========================
       EMPTY
    ========================= */

    #empty {
      display: none;

      padding: 60px 20px;

      text-align: center;

      color: #999;

      font-size: 13px;
    }


    /* =====================================================
       FULL PAGE PHOTO VIEW
       ===================================================== */

    #viewer {
      display: none;

      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      z-index: 1000;

      background: #ffffff;

      overflow-y: auto;
      overflow-x: hidden;
    }

    #viewer.active {
      display: block;
    }

    /* =========================
       VIEWER HEADER
    ========================= */

    .viewer-header {
      width: 100%;
      height: 64px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 20px;

      background: #ffffff;

      border-bottom: 1px solid #eeeeee;

      position: sticky;
      top: 0;

      z-index: 1010;
    }

    .viewer-logo {
      font-size: 18px;
      font-weight: 600;
      color: #222;
      text-decoration: none;
    }

    /*
      THIS IS THE CLOSE BUTTON.
      It is deliberately a normal button,
      not an overlay or fancy positioned element.
    */

    #viewerClose {
      width: 40px;
      height: 40px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0;

      border: 1px solid #d4d4d4;
      border-radius: 50%;

      background: #ffffff;
      color: #222;

      font-size: 23px;
      line-height: 1;

      cursor: pointer;

      -webkit-appearance: none;
      appearance: none;
    }

    #viewerClose:hover {
      background: #f5f5f5;
    }

    /* =========================
       FULL PAGE CONTENT
    ========================= */

    .viewer-page {
      width: 100%;
      min-height: calc(100% - 64px);

      display: flex;
      flex-direction: column;
    }

    /* =========================
       LARGE PHOTO
    ========================= */

    .viewer-photo-section {
      width: 100%;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 35px 30px 25px;

      background: #ffffff;
    }

    #viewerImage {
      display: block;

      width: auto;
      max-width: min(900px, 100%);

      height: auto;
      max-height: 78vh;

      object-fit: contain;

      border-radius: 10px;

      background: #f2f2f2;
    }

    /* =========================
       DETAILS AREA
    ========================= */

    .viewer-information {
      width: 100%;
      max-width: 900px;

      margin: 0 auto;

      padding: 10px 30px 60px;
    }

    #viewerTitle {
      margin: 0 0 13px;

      color: #222;

      font-size: 25px;
      line-height: 1.25;

      font-weight: 500;
    }

    #viewerDescription {
      margin: 0 0 20px;

      color: #555;

      font-size: 14px;
      line-height: 1.65;

      white-space: pre-wrap;
    }

    /* =========================
       HASHTAGS
    ========================= */

    #viewerTags {
      display: flex;
      flex-wrap: wrap;

      gap: 7px;

      margin-bottom: 30px;
    }

    .viewer-tag {
      display: inline-block;

      padding: 6px 10px;

      border-radius: 20px;

      background: #f1e7ec;
      color: #666;

      font-size: 12px;
    }

    /* =========================
       COMMENTS
    ========================= */

    .comments-section {
      width: 100%;

      border-top: 1px solid #eeeeee;

      padding-top: 25px;
    }

    .comments-heading {
      margin: 0 0 18px;

      color: #333;

      font-size: 15px;
      font-weight: 600;
    }

    #commentsList {
      width: 100%;

      display: flex;
      flex-direction: column;

      gap: 15px;

      margin-bottom: 25px;
    }

    .comment {
      padding-bottom: 14px;

      border-bottom: 1px solid #f0f0f0;
    }

    .comment-user {
      margin-bottom: 4px;

      color: #333;

      font-size: 12px;
      font-weight: 600;
    }

    .comment-text {
      color: #555;

      font-size: 13px;
      line-height: 1.5;

      overflow-wrap: anywhere;
    }

    .no-comments {
      color: #999;

      font-size: 13px;
    }

    /* =========================
       COMMENT FORM
    ========================= */

    .comment-form {
      width: 100%;

      display: flex;
      flex-direction: column;

      gap: 9px;
    }

    #commentInput {
      width: 100%;
      min-height: 82px;

      padding: 12px;

      border: 1px solid #dddddd;
      border-radius: 10px;

      background: #fafafa;
      color: #222;

      font-family: inherit;
      font-size: 13px;

      outline: none;

      resize: vertical;
    }

    #commentInput:focus {
      background: #ffffff;
      border-color: #cdb3c0;
    }

    #commentSubmit {
      align-self: flex-end;

      padding: 9px 15px;

      border: 1px solid #d7d7d7;
      border-radius: 8px;

      background: #ffffff;
      color: #333;

      font-size: 12px;

      cursor: pointer;
    }

    #commentSubmit:hover {
      background: #f6f6f6;
    }

    /* =========================
       ADD MODAL
    ========================= */

    #addModal {
      display: none;

      position: fixed;
      inset: 0;

      z-index: 2000;

      background: rgba(0, 0, 0, 0.25);

      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    #addModal.active {
      display: flex;
    }

    .add-box {
      width: 100%;
      max-width: 430px;

      padding: 22px;

      background: #ffffff;

      border-radius: 14px;

      box-shadow: 0 12px 45px rgba(0, 0, 0, 0.15);
    }

    .add-box h2 {
      margin: 0 0 16px;

      font-size: 18px;
      font-weight: 500;
    }

    .add-box input,
    .add-box textarea {
      width: 100%;

      padding: 10px;

      margin-bottom: 10px;

      border: 1px solid #dddddd;
      border-radius: 9px;

      font-family: inherit;
      font-size: 13px;

      outline: none;
    }

    .add-box textarea {
      min-height: 80px;
      resize: vertical;
    }

    .add-actions {
      display: flex;
      justify-content: flex-end;

      gap: 8px;
    }

    .add-actions button {
      padding: 8px 13px;

      border: 1px solid #d7d7d7;
      border-radius: 8px;

      background: #ffffff;

      font-size: 13px;

      cursor: pointer;
    }

    .add-actions button:hover {
      background: #f6f6f6;
    }

    /* =========================
       TABLET
    ========================= */

    @media (max-width: 800px) {

      #gallery {
        column-count: 2;
        column-gap: 9px;

        padding-left: 9px;
        padding-right: 9px;
      }

      .photo-card {
        margin-bottom: 13px;
      }

      .viewer-photo-section {
        padding: 20px 15px 15px;
      }

      #viewerImage {
        max-width: 100%;
        max-height: none;
      }

      .viewer-information {
        padding: 10px 20px 45px;
      }

    }

    /* =========================
       PHONE
    ========================= */

    @media (max-width: 480px) {

      header {
        height: 60px;
        padding: 0 13px;
      }

      .logo {
        font-size: 18px;
      }

      .header-button {
        height: 32px;
        min-width: 32px;

        padding: 0 9px;
      }

      .add-button {
        width: 32px;
        min-width: 32px;
      }

      .search-area {
        padding-left: 13px;
        padding-right: 13px;
      }

      #gallery {
        column-count: 2;
      }

      .photo-title {
        font-size: 11px;
      }

      .viewer-header {
        height: 58px;

        padding: 0 13px;
      }

      .viewer-logo {
        font-size: 17px;
      }

      .viewer-photo-section {
        padding: 15px 10px 10px;
      }

      .viewer-information {
        padding: 10px 16px 40px;
      }

      #viewerTitle {
        font-size: 21px;
      }

      #viewerDescription {
        font-size: 13px;
      }

    }

  </style>
</head>

<body>

  <!-- =====================================================
       HOME
  ===================================================== -->

  <header>

    <a
      href="index.html"
      class="logo">
      kioku 記憶
    </a>

    <div class="header-right">

      <button
        id="profileBtn"
        class="header-button"
        type="button">
        profile
      </button>

      <button
        id="add"
        class="header-button add-button"
        type="button"
        aria-label="Add photo">
        +
      </button>

    </div>

  </header>


  <div class="search-area">

    <input
      id="search"
      type="search"
      placeholder="search"
      autocomplete="off">

  </div>


  <main>

    <div id="gallery"></div>

    <div id="empty">
      nothing here yet.
    </div>

  </main>


  <!-- =====================================================
       FULL PHOTO PAGE
  ===================================================== -->

  <div
    id="viewer"
    aria-hidden="true">

    <div class="viewer-header">

      <a
        href="#"
        class="viewer-logo"
        id="viewerLogo">
        kioku 記憶
      </a>

      <button
        id="viewerClose"
        type="button"
        aria-label="Close photo">
        ×
      </button>

    </div>


    <div class="viewer-page">

      <!-- LARGE IMAGE -->

      <div class="viewer-photo-section">

        <img
          id="viewerImage"
          src=""
          alt="">

      </div>


      <!-- INFORMATION -->

      <div class="viewer-information">

        <h1 id="viewerTitle"></h1>

        <p id="viewerDescription"></p>

        <div id="viewerTags"></div>


        <!-- COMMENTS -->

        <section class="comments-section">

          <h2 class="comments-heading">
            comments
          </h2>

          <div id="commentsList"></div>


          <form
            id="commentForm"
            class="comment-form">

            <textarea
              id="commentInput"
              placeholder="write a comment..."
              maxlength="500"></textarea>

            <button
              id="commentSubmit"
              type="submit">
              add comment
            </button>

          </form>

        </section>

      </div>

    </div>

  </div>


  <!-- =====================================================
       ADD PHOTO
  ===================================================== -->

  <div id="addModal">

    <div class="add-box">

      <h2>add to kioku</h2>

      <input
        id="addTitle"
        type="text"
        placeholder="title">

      <input
        id="addTags"
        type="text"
        placeholder="tags">

      <textarea
        id="addDescription"
        placeholder="description"></textarea>

      <div class="add-actions">

        <button
          id="cancelAdd"
          type="button">
          cancel
        </button>

        <button
          id="saveAdd"
          type="button">
          save
        </button>

      </div>

    </div>

  </div>


  <!-- =====================================================
       SUPABASE
  ===================================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- YOUR EXISTING APP.JS -->

  <script src="app.js"></script>


  <!-- =====================================================
       PHOTO PAGE JAVASCRIPT
  ===================================================== -->

  <script>

    document.addEventListener("DOMContentLoaded", function () {

      const viewer =
        document.getElementById("viewer");

      const closeButton =
        document.getElementById("viewerClose");

      const viewerLogo =
        document.getElementById("viewerLogo");

      const viewerImage =
        document.getElementById("viewerImage");

      const viewerTitle =
        document.getElementById("viewerTitle");

      const viewerDescription =
        document.getElementById("viewerDescription");

      const viewerTags =
        document.getElementById("viewerTags");

      const commentsList =
        document.getElementById("commentsList");

      const commentForm =
        document.getElementById("commentForm");

      const commentInput =
        document.getElementById("commentInput");

      const gallery =
        document.getElementById("gallery");


      let currentPhotoId = null;


      /* =====================================================
         COMMENTS
      ===================================================== */

      function getComments(photoId) {

        try {

          const saved =
            localStorage.getItem(
              "kioku-comments-" + photoId
            );

          if (!saved) {
            return [];
          }

          const comments =
            JSON.parse(saved);

          if (!Array.isArray(comments)) {
            return [];
          }

          return comments;

        } catch (error) {

          return [];

        }

      }


      function saveComments(
        photoId,
        comments
      ) {

        try {

          localStorage.setItem(
            "kioku-comments-" + photoId,
            JSON.stringify(comments)
          );

        } catch (error) {

          console.log(
            "Could not save comments."
          );

        }

      }


      function renderComments(photoId) {

        commentsList.innerHTML = "";

        const comments =
          getComments(photoId);


        if (comments.length === 0) {

          const empty =
            document.createElement("div");

          empty.className =
            "no-comments";

          empty.textContent =
            "no comments yet.";

          commentsList.appendChild(
            empty
          );

          return;
        }


        comments.forEach(
          function (comment) {

            const wrapper =
              document.createElement("div");

            wrapper.className =
              "comment";


            const username =
              document.createElement("div");

            username.className =
              "comment-user";

            username.textContent =
              comment.username || "you";


            const text =
              document.createElement("div");

            text.className =
              "comment-text";

            text.textContent =
              comment.text;


            wrapper.appendChild(
              username
            );

            wrapper.appendChild(
              text
            );

            commentsList.appendChild(
              wrapper
            );

          }
        );

      }


      /* =====================================================
         OPEN VIEWER
      ===================================================== */

      function openViewer(photo) {

        if (!photo) {
          return;
        }


        currentPhotoId =
          photo.id ||
          photo.src ||
          String(Date.now());


        viewerImage.src =
          photo.src || "";


        viewerImage.alt =
          photo.title ||
          "kioku photo";


        viewerTitle.textContent =
          photo.title ||
          "untitled";


        viewerDescription.textContent =
          photo.description ||
          "";


        viewerTags.innerHTML = "";


        if (
          Array.isArray(photo.tags) &&
          photo.tags.length > 0
        ) {

          photo.tags.forEach(
            function (tag) {

              const tagElement =
                document.createElement(
                  "span"
                );

              tagElement.className =
                "viewer-tag";

              tagElement.textContent =
                "#" +
                String(tag)
                  .replace(/^#/, "");

              viewerTags.appendChild(
                tagElement
              );

            }
          );

        }


        renderComments(
          currentPhotoId
        );


        viewer.classList.add(
          "active"
        );


        viewer.setAttribute(
          "aria-hidden",
          "false"
        );


        document.body.style.overflow =
          "hidden";


        /*
          Start at the top of the
          photo page every time.
        */

        viewer.scrollTop = 0;

      }


      /* =====================================================
         CLOSE VIEWER
      ===================================================== */

      function closeViewer() {

        /*
          Remove the active class.
        */

        viewer.classList.remove(
          "active"
        );


        /*
          Explicitly hide it too.
        */

        viewer.style.display =
          "none";


        viewer.setAttribute(
          "aria-hidden",
          "true"
        );


        document.body.style.overflow =
          "";


        viewerImage.src =
          "";


        currentPhotoId =
          null;

      }


      /*
        X BUTTON
      */

      closeButton.addEventListener(
        "click",
        function (event) {

          event.preventDefault();

          event.stopPropagation();

          closeViewer();

        }
      );


      /*
        Logo also closes the photo page
        and returns to the home gallery.
      */

      viewerLogo.addEventListener(
        "click",
        function (event) {

          event.preventDefault();

          closeViewer();

        }
      );


      /*
        Escape key
      */

      document.addEventListener(
        "keydown",
        function (event) {

          if (
            event.key === "Escape" &&
            viewer.classList.contains("active")
          ) {

            closeViewer();

          }

        }
      );


      /* =====================================================
         FIND PHOTO DATA FROM HOME CARDS
      ===================================================== */

      function attachPhotoClicks() {

        if (!gallery) {
          return;
        }


        const cards =
          gallery.querySelectorAll(
            ".photo-card"
          );


        cards.forEach(
          function (card) {

            if (
              card.dataset.kiokuViewerAttached
            ) {
              return;
            }


            card.dataset.kiokuViewerAttached =
              "true";


            card.addEventListener(
              "click",
              function (event) {

                /*
                  Prevent accidentally opening
                  a link/button inside a card.
                */

                if (
                  event.target.closest(
                    "button, a"
                  )
                ) {
                  return;
                }


                const image =
                  card.querySelector("img");


                if (!image) {
                  return;
                }


                const titleElement =
                  card.querySelector(
                    ".photo-title, .title"
                  );


                const descriptionElement =
                  card.querySelector(
                    ".photo-description, .description"
                  );


                /*
                  Look for hidden tag elements
                  that app.js may already create.
                */

                const tagElements =
                  card.querySelectorAll(
                    ".photo-tags span, .tags span, .hashtags span"
                  );


                const tags = [];


                tagElements.forEach(
                  function (element) {

                    const value =
                      element.textContent.trim();


                    if (value) {
                      tags.push(value);
                    }

                  }
                );


                openViewer({

                  id:
                    card.dataset.id ||
                    image.src,

                  src:
                    image.src,

                  title:
                    titleElement
                      ? titleElement.textContent.trim()
                      : "",

                  description:
                    descriptionElement
                      ? descriptionElement.textContent.trim()
                      : "",

                  tags:
                    tags

                });

              }
            );

          }
        );

      }


      /* =====================================================
         WATCH FOR PHOTOS ADDED BY APP.JS
      ===================================================== */

      if (gallery) {

        const galleryObserver =
          new MutationObserver(
            function () {

              attachPhotoClicks();


              /*
                Hide tags only on the
                home gallery.
              */

              const tags =
                gallery.querySelectorAll(
                  ".photo-tags, .tags, .hashtags"
                );


              tags.forEach(
                function (element) {

                  element.style.display =
                    "none";

                }
              );

            }
          );


        galleryObserver.observe(
          gallery,
          {
            childList: true,
            subtree: true
          }
        );


        attachPhotoClicks();

      }


      /* =====================================================
         COMMENT SUBMISSION
      ===================================================== */

      commentForm.addEventListener(
        "submit",
        function (event) {

          event.preventDefault();


          if (!currentPhotoId) {
            return;
          }


          const text =
            commentInput.value.trim();


          if (!text) {
            return;
          }


          const comments =
            getComments(
              currentPhotoId
            );


          comments.push({

            username: "you",

            text: text,

            created_at:
              new Date()
                .toISOString()

          });


          saveComments(
            currentPhotoId,
            comments
          );


          commentInput.value =
            "";


          renderComments(
            currentPhotoId
          );

        }
      );


      /* =====================================================
         IMPORTANT:
         IF APP.JS OPENS THE OLD VIEWER ITSELF,
         THIS MAKES THE NEW FULL PAGE VISIBLE.
      ===================================================== */

      const viewerObserver =
        new MutationObserver(
          function () {

            if (
              viewer.classList.contains(
                "active"
              )
            ) {

              viewer.style.display =
                "block";

            }

          }
        );


      viewerObserver.observe(
        viewer,
        {
          attributes: true,
          attributeFilter: ["class"]
        }
      );

    });

  </script>

</body>
</html>
