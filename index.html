<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>kioku 記憶</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #ffffff;
      color: #222;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      width: 100%;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      background: #ffffff;
      border-bottom: 1px solid #eeeeee;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .logo {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.4px;
      color: #222;
      text-decoration: none;
      white-space: nowrap;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-button {
      height: 34px;
      min-width: 34px;
      padding: 0 11px;
      border: 1px solid #d8d8d8;
      border-radius: 9px;
      background: #ffffff;
      color: #222;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .header-button:hover {
      background: #f7f7f7;
      border-color: #c7c7c7;
    }

    .add-button {
      width: 34px;
      min-width: 34px;
      padding: 0;
      font-size: 20px;
      line-height: 1;
    }

    /* =========================
       SEARCH
    ========================= */

    .search-area {
      width: 100%;
      padding: 14px 18px 8px;
    }

    #search {
      width: 100%;
      max-width: 520px;
      height: 38px;
      border: 1px solid #dddddd;
      border-radius: 10px;
      padding: 0 13px;
      font-size: 13px;
      outline: none;
      background: #fafafa;
      color: #222;
    }

    #search:focus {
      border-color: #cdb3c0;
      background: #ffffff;
    }

    /* =========================
       GALLERY
    ========================= */

    #gallery {
      width: 100%;
      padding: 10px 14px 30px;

      column-count: 3;
      column-gap: 12px;
    }

    .photo-card {
      width: 100%;
      display: inline-block;
      vertical-align: top;
      margin: 0 0 12px;
      break-inside: avoid;
      -webkit-column-break-inside: avoid;
      cursor: pointer;
    }

    .photo-card img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
      object-fit: cover;
      background: #f2f2f2;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    .photo-card:hover img {
      opacity: 0.92;
    }

    /*
      Hashtags are deliberately NOT shown
      on the home gallery.
    */

    .photo-tags {
      display: none !important;
    }

    .photo-title {
      display: none !important;
    }

    /* =========================
       EMPTY STATE
    ========================= */

    #empty {
      display: none;
      text-align: center;
      color: #999;
      font-size: 13px;
      padding: 60px 20px;
    }

    /* =========================
       PHOTO VIEWER
    ========================= */

    #viewer {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(255, 255, 255, 0.97);
      overflow-y: auto;
      padding: 70px 18px 30px;
    }

    #viewer.active {
      display: block;
    }

    .viewer-close {
      position: fixed;
      top: 16px;
      right: 17px;

      width: 38px;
      height: 38px;

      border: 1px solid #d5d5d5;
      border-radius: 50%;

      background: #ffffff;
      color: #222;

      font-size: 22px;
      line-height: 1;

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;
      z-index: 210;
    }

    .viewer-close:hover {
      background: #f5f5f5;
    }

    .viewer-content {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    #viewerImage {
      display: block;
      width: auto;
      max-width: 100%;
      max-height: 75vh;
      margin: 0 auto;
      border-radius: 8px;
      object-fit: contain;
    }

    .viewer-info {
      max-width: 700px;
      margin: 18px auto 0;
      padding: 0 4px;
    }

    #viewerTitle {
      margin: 0 0 9px;
      font-size: 16px;
      font-weight: 500;
      color: #222;
    }

    #viewerTags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .viewer-tag {
      font-size: 12px;
      color: #777;
      background: #f1e7ec;
      border-radius: 20px;
      padding: 5px 9px;
    }

    /* =========================
       ADD MODAL
    ========================= */

    #addModal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 300;
      background: rgba(0, 0, 0, 0.25);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #addModal.active {
      display: flex;
    }

    .add-box {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 12px 45px rgba(0, 0, 0, 0.15);
    }

    .add-box h2 {
      margin: 0 0 16px;
      font-size: 18px;
      font-weight: 500;
    }

    .add-box input,
    .add-box textarea {
      width: 100%;
      border: 1px solid #dddddd;
      border-radius: 9px;
      padding: 10px;
      margin-bottom: 10px;
      font-family: inherit;
      font-size: 13px;
      outline: none;
    }

    .add-box textarea {
      min-height: 80px;
      resize: vertical;
    }

    .add-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .add-actions button {
      border: 1px solid #d7d7d7;
      background: #ffffff;
      border-radius: 8px;
      padding: 8px 13px;
      font-size: 13px;
      cursor: pointer;
    }

    .add-actions button:hover {
      background: #f6f6f6;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 800px) {
      #gallery {
        column-count: 2;
        column-gap: 9px;
        padding-left: 9px;
        padding-right: 9px;
      }

      .photo-card {
        margin-bottom: 9px;
      }

      header {
        padding: 0 13px;
      }

      .search-area {
        padding-left: 13px;
        padding-right: 13px;
      }
    }

    @media (max-width: 480px) {
      header {
        height: 60px;
      }

      .logo {
        font-size: 18px;
      }

      .header-button {
        height: 32px;
        min-width: 32px;
        padding: 0 9px;
      }

      .add-button {
        width: 32px;
        min-width: 32px;
      }

      #gallery {
        column-count: 2;
      }

      #viewer {
        padding-left: 12px;
        padding-right: 12px;
        padding-top: 65px;
      }

      #viewerImage {
        max-height: 70vh;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header>
    <a href="index.html" class="logo">
      kioku 記憶
    </a>

    <div class="header-right">
      <button
        id="profileBtn"
        class="header-button"
        type="button">
        profile
      </button>

      <button
        id="add"
        class="header-button add-button"
        type="button"
        aria-label="Add photo">
        +
      </button>
    </div>
  </header>


  <!-- =========================
       SEARCH
  ========================== -->

  <div class="search-area">
    <input
      id="search"
      type="search"
      placeholder="search"
      autocomplete="off">
  </div>


  <!-- =========================
       GALLERY
  ========================== -->

  <main>
    <div id="gallery"></div>

    <div id="empty">
      nothing here yet.
    </div>
  </main>


  <!-- =========================
       PHOTO VIEWER
  ========================== -->

  <div id="viewer" aria-hidden="true">

    <button
      id="viewerClose"
      class="viewer-close"
      type="button"
      aria-label="Close">
      ×
    </button>

    <div class="viewer-content">

      <img
        id="viewerImage"
        src=""
        alt="">

      <div class="viewer-info">

        <h2 id="viewerTitle"></h2>

        <div id="viewerTags"></div>

      </div>

    </div>
  </div>


  <!-- =========================
       ADD PHOTO MODAL
  ========================== -->

  <div id="addModal">

    <div class="add-box">

      <h2>add to kioku</h2>

      <input
        id="addTitle"
        type="text"
        placeholder="title">

      <input
        id="addTags"
        type="text"
        placeholder="tags">

      <textarea
        id="addDescription"
        placeholder="description"></textarea>

      <div class="add-actions">

        <button
          id="cancelAdd"
          type="button">
          cancel
        </button>

        <button
          id="saveAdd"
          type="button">
          save
        </button>

      </div>

    </div>

  </div>


  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Your existing app -->
  <script src="app.js"></script>


  <!-- =========================
       VIEWER FIX
  ========================== -->

  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const viewer = document.getElementById("viewer");
      const closeButton = document.getElementById("viewerClose");

      /*
        This explicitly handles the X button.
        It also works even if app.js uses a different
        method for opening the viewer.
      */

      function closeViewer() {
        if (!viewer) return;

        viewer.classList.remove("active");
        viewer.style.display = "none";
        viewer.setAttribute("aria-hidden", "true");

        document.body.style.overflow = "";
      }

      if (closeButton) {
        closeButton.addEventListener("click", function (event) {
          event.preventDefault();
          event.stopPropagation();
          closeViewer();
        });
      }

      /*
        Clicking the dark/empty area around the photo
        also closes the viewer.
      */

      if (viewer) {
        viewer.addEventListener("click", function (event) {
          if (event.target === viewer) {
            closeViewer();
          }
        });
      }

      /*
        Escape key closes the viewer too.
      */

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
          closeViewer();
        }
      });


      /*
        When app.js opens the viewer, make sure the
        viewer receives the correct visible state.
      */

      const observer = new MutationObserver(function () {

        if (!viewer) return;

        const computed = window.getComputedStyle(viewer);

        if (
          computed.display !== "none" &&
          !viewer.classList.contains("active")
        ) {
          viewer.classList.add("active");
          viewer.setAttribute("aria-hidden", "false");
          document.body.style.overflow = "hidden";
        }

      });

      if (viewer) {
        observer.observe(viewer, {
          attributes: true,
          attributeFilter: ["style", "class"]
        });
      }


      /*
        Hide hashtags/title from the home gallery.
        They remain available in the photo viewer.
      */

      function cleanGallery() {

        const gallery = document.getElementById("gallery");

        if (!gallery) return;

        const cards = gallery.children;

        for (let i = 0; i < cards.length; i++) {

          const card = cards[i];

          const tags = card.querySelector(
            ".photo-tags, .tags, .hashtags"
          );

          const title = card.querySelector(
            ".photo-title, .title"
          );

          if (tags) {
            tags.style.display = "none";
          }

          if (title) {
            title.style.display = "none";
          }
        }
      }


      /*
        Run once and again whenever app.js adds
        or changes photos.
      */

      cleanGallery();

      const gallery = document.getElementById("gallery");

      if (gallery) {

        const galleryObserver = new MutationObserver(function () {
          cleanGallery();
        });

        galleryObserver.observe(gallery, {
          childList: true,
          subtree: true
        });
      }

    });
  </script>

</body>
</html>
